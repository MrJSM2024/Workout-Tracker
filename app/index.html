<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dose Log</title>
<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d110f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f3f2ee; --card: #ffffff; --raised: #f8f7f4; --text: #18201b; --muted: #6b736d; --faint: #9aa19c; --line: #e7e6e1;
    --accent: #1f7a4d; --accent-strong: #145a37; --accent-soft: #e3f1e8; --on-accent: #ffffff;
    --warn: #9a5b06; --warn-soft: #fbf0dc; --bad: #b42318; --bad-soft: #fde7e4; --sos: #6d3fd9; --sos-soft: #efe9fd;
    --c-bridge: #16a34a; --c-high: #7c3aed; --grid: #e7e6e1;
    --d125: #14b8a6; --d25: #3b82f6; --d375: #9333ea; --d5: #9f1239; --d125-text: #0f766e; --d125-ink: #fff; --d25-ink: #fff; --d375-ink: #fff; --d5-ink: #fff;
    --shadow: 0 1px 2px rgba(24,32,27,.05), 0 6px 20px rgba(24,32,27,.06);
    --hero-dose: linear-gradient(150deg, #1f7a4d 0%, #145a37 100%);
    --hero-off: linear-gradient(150deg, #ffffff 0%, #f1f4f1 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d110f; --card: #161b18; --raised: #1c221e; --text: #e9eeea; --muted: #9aa59e; --faint: #6c766f; --line: #252c27;
      --accent: #4cc38a; --accent-strong: #2f9e68; --accent-soft: #15301f; --on-accent: #062012;
      --warn: #f2b53c; --warn-soft: #33270b; --bad: #f38b80; --bad-soft: #3a1714; --sos: #a78bfa; --sos-soft: #251c40;
      --c-bridge: #16a34a; --c-high: #8b5cf6; --grid: #252c27;
      --d125: #2dd4bf; --d25: #60a5fa; --d375: #a855f7; --d5: #e11d48; --d125-text: #2dd4bf; --d125-ink: #0b2530; --d25-ink: #fff; --d375-ink: #fff; --d5-ink: #fff;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
      --hero-dose: linear-gradient(150deg, #1d6b45 0%, #10432a 100%);
      --hero-off: linear-gradient(150deg, #1a201c 0%, #151a17 100%);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; }
  header { max-width: 560px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 20px 4px; }
  header .eyebrow { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  header h1 { font-size: 30px; line-height: 1.15; margin: 2px 0 0; letter-spacing: -.02em; }
  main { padding: 0 16px calc(104px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 4px;
    background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); z-index: 5; }
  nav button { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px;
    border: 0; background: none; color: var(--faint); font-size: 12px; font-weight: 600; border-radius: 14px; }
  nav button svg { width: 24px; height: 24px; padding: 2px 14px; box-sizing: content-box; border-radius: 999px; }
  nav button.on { color: var(--text); }
  nav button.on svg { background: var(--accent-soft); color: var(--accent); }

  .card { background: var(--card); border-radius: 20px; padding: 18px; margin: 14px 0; box-shadow: var(--shadow); }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
  .card-title { font-size: 17px; font-weight: 700; margin: 0 0 2px; }
  .plan-text { color: var(--muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .entry { font-size: 13px; color: var(--muted); }
  .entry button { border: 0; background: none; color: var(--bad); font-size: 13px; padding: 8px 6px; margin: -6px 0; }
  .hidden { display: none !important; }

  /* hero */
  .hero { border-radius: 26px; padding: 22px 20px 18px; margin: 14px 0; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .hero.dose { background: var(--hero-dose); color: #fff; }
  .hero.off, .hero.done { background: var(--hero-off); color: var(--text); }
  .hero .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; opacity: .75; }
  .hero h2 { font-size: 40px; line-height: 1.05; margin: 6px 0 6px; letter-spacing: -.03em; font-weight: 800; }
  .hero h2 small { font-size: 22px; font-weight: 700; letter-spacing: -.01em; opacity: .85; }
  .hero .sub { font-size: 15px; opacity: .85; }
  .hero .chip { display: block; margin-top: 10px; padding: 9px 12px; border-radius: 12px; font-size: 14px; }
  .hero.dose .chip { background: rgba(255,255,255,.14); color: #fff; }
  .hero.off .chip, .hero.done .chip { background: var(--raised); color: var(--muted); }
  .hero .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .hero .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .hero .chip.ok { background: var(--accent-soft); color: var(--accent); }
  .hero .done-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 6px 12px 6px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; }
  .hero.dose .done-badge { background: rgba(255,255,255,.18); color: #fff; }
  .quick { display: flex; gap: 10px; margin-top: 16px; }
  .btn-hero { flex: 1; min-height: 54px; border-radius: 16px; border: 0; font-size: 17px; font-weight: 800; }
  .hero.dose .btn-hero { background: #fff; color: #145a37; }
  .hero.dose .btn-hero.ghost { background: rgba(255,255,255,.14); color: #fff; }
  .hero.off .btn-hero, .hero.done .btn-hero { background: var(--accent); color: var(--on-accent); }

  /* 7-day timeline */
  .timeline { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(127,127,127,.18); }
  .tl { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; }
  .tl .wd { opacity: .6; }
  .tl .dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
  .tl .d-bridge { background: var(--c-bridge); color: #fff; }
  .tl .d-high { background: var(--c-high); color: #fff; }
  .hero.dose .tl .d-bridge, .hero.dose .tl .d-high { box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
  .tl .d-off { background: transparent; }
  .tl .d-off::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .35; }
  .tl .d-plan { border: 2px dashed currentColor; opacity: .75; }
  .tl .d-none { opacity: .3; }
  .tl.today .dn { padding: 1px 7px; border-radius: 999px; background: currentColor; }
  .hero.dose .tl.today .dn { background: #fff; color: #145a37; }
  .hero.off .tl.today .dn, .hero.done .tl.today .dn { background: var(--text); color: var(--card); }
  .tl-legend { display: flex; justify-content: center; gap: 14px; margin-top: 10px; font-size: 11px; opacity: .7; }
  .tl-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  /* feeling segmented control */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .feel { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 14px;
    border: 2px solid transparent; background: var(--raised); color: var(--muted); font-size: 13px; font-weight: 700; }
  .feel svg { width: 24px; height: 24px; }
  .feel.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .feel.sel.rough { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }

  /* forms */
  .dose-btn { flex: 1 1 28%; min-height: 60px; border-radius: 14px; border: 2px solid transparent; background: var(--raised);
    color: var(--text); font-size: 19px; font-weight: 800; }
  .dose-btn small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
  .dose-btn.sel { border-color: var(--accent); background: var(--accent-soft); }
  select, input, textarea { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--raised); color: var(--text); outline: none; }
  select:focus, input:focus { border-color: var(--accent); }
  label.f { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); font-weight: 600; }
  label.f input, label.f select { margin-top: 6px; }
  .primary { width: 100%; margin-top: 16px; min-height: 54px; border: 0; border-radius: 16px; background: var(--accent);
    color: var(--on-accent); font-size: 17px; font-weight: 800; }
  .secondary { padding: 12px 16px; border-radius: 14px; border: 0; background: var(--raised); color: var(--text); font-weight: 700; }
  details.logform > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  details.logform > summary::-webkit-details-marker { display: none; }
  details.logform > summary .chev { width: 32px; height: 32px; border-radius: 50%; background: var(--raised); display: flex;
    align-items: center; justify-content: center; transition: transform .2s; color: var(--muted); flex: none; }
  details.logform[open] > summary .chev { transform: rotate(180deg); }
  details.more > summary { color: var(--muted); font-weight: 600; font-size: 14px; margin-top: 14px; }
  details summary { cursor: pointer; }

  .note { padding: 10px 12px; border-radius: 12px; margin-top: 10px; font-size: 14px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.bad { background: var(--bad-soft); color: var(--bad); }
  .note.ok { background: var(--accent-soft); color: var(--accent); }
  .note.info { background: var(--raised); color: var(--muted); }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 16px;
    background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; margin-top: 10px; }
  .banner button { border: 0; background: var(--warn); color: var(--card); border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 13px; }

  /* toast */
  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(150px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto;
    background: var(--text); color: var(--card); border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between;
    align-items: center; gap: 10px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 200;
    opacity: 0; transform: translateY(14px); pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.2,.85,.25,1); }
  #toast.show { opacity: 1; transform: none; pointer-events: auto; }
  #toast .tmsg { display: flex; align-items: center; gap: 8px; }
  #toast button { border: 0; background: none; color: var(--accent-soft); font-weight: 800; padding: 6px 4px; text-decoration: underline; }
  #toast button:active { transform: none; opacity: .7; }

  /* history */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
  .cal .h { font-size: 11px; color: var(--faint); text-align: center; font-weight: 700; }
  .cal .c { aspect-ratio: 1; border-radius: 10px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    background: var(--raised); color: var(--faint); position: relative; }
  .cal .c.d125 { background: var(--d125); color: var(--d125-ink); }
  .cal .c.d25 { background: var(--d25); color: var(--d25-ink); }
  .cal .c.d375 { background: var(--d375); color: var(--d375-ink); }
  .cal .c.d5 { background: var(--d5); color: var(--d5-ink); }
  .cal .c.today { outline: 2px solid var(--text); outline-offset: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .wk-head { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 4px 6px; }
  .wk-head b { font-size: 15px; }
  .wk-head span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .day-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .day-row:last-child { border-bottom: 0; }
  .day-num { width: 42px; text-align: center; flex: none; }
  .day-num b { display: block; font-size: 20px; line-height: 1; }
  .day-num span { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  .day-body { flex: 1; min-width: 0; }
  .pill { display: inline-block; min-width: 58px; text-align: center; padding: 5px 9px; border-radius: 999px; font-weight: 800; font-size: 13px; flex: none; }
  .p-off { background: var(--raised); color: var(--faint); }
  .p-bridge { background: var(--accent-soft); color: var(--accent); }
  .p-high { background: var(--sos-soft); color: var(--sos); }
  .p-over { background: var(--bad-soft); color: var(--bad); }
  .feel-tag { display: table; margin-bottom: 3px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--raised); color: var(--muted); margin-left: 6px; }
  .feel-tag.rough { background: var(--warn-soft); color: var(--warn); }

  /* trends */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .kpi { background: var(--card); border-radius: 18px; padding: 14px 12px; box-shadow: var(--shadow); }
  .kpi b { display: block; font-size: 22px; line-height: 1.15; letter-spacing: -.02em; white-space: nowrap; }
  .kpi b small { font-size: 12px; color: var(--muted); font-weight: 700; }
  .kpi span { display: block; margin-top: 2px; }
  .kpi span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .sign { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .sign:last-child { border-bottom: 0; }
  .sign .ic { width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; }
  .sign .ic.okc { background: var(--accent-soft); color: var(--accent); }
  .sign .ic.flagc { background: var(--bad-soft); color: var(--bad); }
  .sign .t { flex: 1; font-size: 14px; }
  .sign .t small { display: block; color: var(--muted); font-size: 12px; }
  .sign .v { font-weight: 800; white-space: nowrap; }
  .sign .v.flag { color: var(--bad); }
  .steps { display: flex; gap: 6px; margin: 12px 0 4px; }
  .steps div { flex: 1; text-align: center; padding: 8px 2px; border-radius: 12px; background: var(--raised); color: var(--faint); font-size: 12px; font-weight: 800; }
  .steps div.done { background: var(--accent-soft); color: var(--accent); }
  .steps div.cur { background: var(--accent); color: var(--on-accent); }
  .bar { height: 10px; border-radius: 999px; background: var(--raised); overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  .stat { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .stat:last-child { border-bottom: 0; }
  .stat b { white-space: nowrap; padding-left: 8px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-size: 10px; }
  .chart .val { fill: var(--text); font-weight: 700; }
  .chart.curve text { font-size: 12px; }
  .chart.curve .val.big { font-size: 15px; font-weight: 800; }
  .taper-head { margin: 8px 0 10px; }
  .curve-title { display: flex; justify-content: space-between; align-items: center; }
  .pct-toggle { min-width: 44px; height: 32px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--raised); color: var(--muted); font: inherit; font-size: 15px; font-weight: 800; }
  .pct-toggle.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .big-num { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .big-num small { font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: 0; }
  .taper-head .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .taper-head .chg { color: var(--text); }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .bg { fill: transparent; }
  .chart .bg.on { fill: var(--grid); opacity: .6; }
  .readout { font-size: 14px; min-height: 20px; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--raised); }
  table.wk { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.wk th, table.wk td { text-align: right; padding: 6px 2px; border-bottom: 1px solid var(--line); }
  table.wk th:first-child, table.wk td:first-child { text-align: left; }

  /* settings */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .tile { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; border-radius: 16px; border: 0;
    background: var(--raised); color: var(--text); font-weight: 700; font-size: 15px; text-align: left; }
  .tile svg { width: 22px; height: 22px; color: var(--accent); }
  .tile small { font-weight: 500; color: var(--muted); font-size: 12px; }
  .tile.main { grid-column: span 2; flex-direction: row; align-items: center; background: var(--accent); color: var(--on-accent); }
  .tile.main svg, .tile.main small { color: var(--on-accent); opacity: .9; }
  .rules p, .rules li { font-size: 14px; }
  .rules li { margin-bottom: 6px; }
  .danger { width: 100%; padding: 14px; border-radius: 16px; border: 1.5px solid var(--bad-soft); background: none; color: var(--bad); font-weight: 700; }
  .version { text-align: center; font-size: 12px; color: var(--faint); margin: 18px 0 6px; }

  /* app-like behavior */
  html, body { overscroll-behavior-y: contain; }
  body { touch-action: manipulation; }
  button, nav, .tl { -webkit-user-select: none; user-select: none; }
  button { transition: transform .12s ease, background-color .15s ease, opacity .15s ease; }
  button:active { transform: scale(.97); }
  .day-row, .tappable { cursor: pointer; transition: background-color .15s; }
  .day-row:active, .tappable:active { background: var(--raised); }
  .view-in { animation: viewin .22s ease both; }
  @keyframes viewin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes popin { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .done-badge.pop { animation: popin .4s cubic-bezier(.2,1.4,.4,1) both; }
  .done-badge.pop svg path, .tcheck path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw .4s .15s ease forwards; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
  }
  button.tl { background: none; border: 0; color: inherit; padding: 0; font: inherit; font-size: 11px; font-weight: 600; }
  button.tl:active { transform: none; }
  button.tl:active .dot { transform: scale(.9); }
  .tl .dot { transition: transform .12s ease; }
  .cal button.c { border: 0; padding: 0; font-family: inherit; }
  .cal button.c:active { transform: scale(.9); }

  /* bottom sheets */
  .scrim { position: fixed; inset: 0; background: rgba(8,12,10,.5); opacity: 0; transition: opacity .25s ease; }
  .scrim.show { opacity: 1; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--card);
    border-radius: 28px 28px 0 0; padding: 8px 18px 0; max-height: 90vh; max-height: 90dvh; overflow-y: auto; overscroll-behavior: contain;
    transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.85,.25,1); box-shadow: 0 -12px 48px rgba(0,0,0,.28); }
  .sheet.show { transform: none; }
  .sheet-body { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  .grab { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 16px; }
  .sheet-title { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .sheet-sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .sheet-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .sheet-actions .primary { margin-top: 0; }
  .secondary.wide { width: 100%; text-align: center; }
  .primary.danger-fill { background: var(--bad); color: #fff; }
  .primary.warnbtn { background: var(--warn); color: var(--card); }

  ${card('Missed a 0.125', 'Take it when you remember, same day or next. The count restarts from that day. Never double up.', simulatePattern([B, OFF, { dose: 0, missed: true }], { cycles: 2 }))}
  <details class="more"><summary>More situations: sleep, tremor, other medication</summary>
  ${card("Can't sleep, no dose yet today", 'Acute stress keeping you up: 0.25 at night.', simulatePattern([{ dose: 0.25, reason: 'sleep', cap: 'night' }]), ["Until you've slept, it's still the same day (before 6 AM counts as the day before).", 'Not two nights in a row. Max twice in 30 days.'])}
  ${card("Can't sleep, took 0.125 this morning", '0.25 at night, total 0.375 for the day.', simulatePattern([{ dose: 0.375, reason: 'sleep', cap: '0.125 + 0.25' }]))}
  ${card("Can't sleep, took 0.25 this morning", 'Not part of the plan. If it happens anyway (total 0.5): skip 3 days.', simulatePattern([{ dose: 0.5, reason: 'sleep', cap: '0.25 + 0.25' }]))}
  ${card('Tremor, tingling or twitching', 'On an off day with no stressful trigger: 0.125, unless there was any dose yesterday. It restarts the count.', simulatePattern([H('SOS'), OFF, { dose: 0.125, reason: 'tremor', cap: 'tremor' }]))}
  ${card('Other medication day', 'Logged as a note, not counted. The next due day is your call: 0.125 or off.', simulatePattern([B, { dose: 0, reason: 'othermed', note: 'other medication', cap: 'other med' }]))}
  </details>
  <div class="section-h">Widening ladder</div>
  <div class="card">
    <div class="entry">One step at a time, only when off days have felt fine for 2 weeks. Hold each step at least 14 days. Earliest first widening: ${fmt(widenEarliest())}. High days never change the step.</div>
    ${[2, 3, 4, 7].map(n => `<div class="ladder ${n === every ? 'cur' : ''}"><div class="lh"><b>${capFirst(intervalName(n))}</b>${n === every ? '<span class="here">You are here</span>' : ''}</div>${chainHtml(simulatePattern([B], { every: n }))}</div>`).join('')}
    <div class="ladder ${every === 0 ? 'cur' : ''}"><div class="lh"><b>None</b>${every === 0 ? '<span class="here">You are here</span>' : ''}</div><div class="entry" style="margin-top:6px">No scheduled doses. A hard day is followed only by off days.</div></div>
  </div>
  ${widenCardHtml(today)}
  ${card(`Hard day at ${intervalName(ex)}`, `0.25, then off for 2 days or your current interval, whichever is longer, then 0.125.${every > 2 ? '' : ' (Example for when you widen.)'}`, simulatePattern([H('SOS')], { every: ex }))}
  <div class="section-h">Hard limits</div>
  <div class="card">
    ${rule('Never above 0.25 in a day. Exception: 0.375 when the extra 0.25 is at night for sleep.')}
    ${rule('Never 0.125 two days in a row.')}
    ${rule('No 4th high day in a row. If the emergency is still going on, get medical advice.')}
    ${rule('Sleep exception: not two nights in a row, and no more than twice in 30 days.')}
    ${rule('0.25 only for genuinely acute stress, not an ordinary difficult day.')}
  </div>
  <div class="section-h">Warning signs: reassess the plan</div>
  <div class="card">
    ${rule('0.25 stops feeling sufficient, or you want more.', 1)}
    ${rule('High days rising over three 28-day blocks.', 1)}
    ${rule('3 or more high days within 7 days that are not one run.', 1)}
    ${rule('More than one very high day (0.5 or more).', 1)}
    ${rule('Tremor, tingling or twitching keeps returning on off days (2 or more in 30 days).', 1)}
  </div>
  <p class="entry" style="text-align:center;margin:18px 8px 6px">These chains are produced by the same rules the app uses, so they always match what Today tells you.</p>`;
  bindWiden(today);
}

function renderToday() {
  const today = logicalToday();
  const p = planFor(today);
  const info = dayInfo(today);
  const lb = S.settings.lastBackup;
  const lbAge = lb ? Math.max(0, diffDays(logicalOf(lb), today)) : null;
  const backupDue = S.entries.length && (lbAge === null || lbAge >= 7);
  const unsaved = lb ? S.entries.filter(e => e.at > lb).length : S.entries.length;
  const backupLine = S.entries.length && !backupDue
    ? `<div class="backup-line"><span>Last backup: ${lbAge === 0 ? 'today' : lbAge + ' day' + (lbAge > 1 ? 's' : '') + ' ago'}${unsaved ? ` · ${unsaved} new entr${unsaved === 1 ? 'y' : 'ies'} since` : ''}</span><button id="bk-line">Back up</button></div>` : '';
  const gaps = gapDays(today);
  const sym = symOf(today);
  const feel = S.checkins[today];
  const cycle = currentCycle(today);
  const logged = info.entries.length > 0;
  const choice = p.head.includes(' or ');
  const heroCls = logged ? 'done' : p.kind === 'due' ? 'dose' : 'off';
  const pop = justSaved;
  let title, quick = '';
  if (logged) title = info.total > EPS ? `${num(info.total)} <small>mg logged</small>` : 'Off day';
  else if (p.kind === 'due') title = choice ? '0.125 <small>or off</small>' : `0.125 <small>mg today</small>`;
  else if (p.kind === 'off') title = 'Off day';
  else title = '—';
  if (!logged && p.kind === 'due')
    quick = `<div class="quick"><button class="btn-hero" id="q-take">I took 0.125</button>${choice ? '<button class="btn-hero ghost" id="q-off">Off today</button>' : ''}</div>`;
  else if (!logged && p.kind === 'off')
    quick = `<div class="quick"><button class="btn-hero" id="q-off">Confirm off day</button></div>`;

  $('#app').innerHTML = `
  ${backupDue ? `<div class="banner"><span>${lbAge === null ? 'No backup yet' : 'No backup in ' + lbAge + ' days'}</span><button id="bk-now">Back up</button></div>` : ''}
  ${catchUpHtml(gaps)}
  <section class="hero ${heroCls}">
    <div class="eyebrow">${logged ? 'Logged today' : 'Plan for today'}</div>
    <h2>${title}</h2>
    <div class="sub">${esc(p.text)}</div>
    ${(p.notes || []).map(n => `<div class="chip ${n.cls === 'info' ? '' : n.cls}">${esc(n.t)}</div>`).join('')}
    ${gaps.length ? '<div class="chip warn">Earlier days are not logged, so this plan may change. Catch up above.</div>' : ''}
    ${logged ? `<div class="done-badge ${pop ? 'pop' : ''}">${ICON.check} Saved for ${fmt(today)}</div>` : ''}
    ${quick}
    ${cycle ? chainHtml(cycle) : ''}
    ${rollingLine(today)}
  </section>
  <div class="card morning">
    <div class="m-head"><div class="card-title">What's going on this morning?</div><span>tap all that apply</span></div>
    <div class="reasons">${SYMPTOM_TAGS.map(t => `<button class="reason ${sym.tags.includes(t) ? 'sel' : ''}" data-tag="${esc(t)}" aria-pressed="${sym.tags.includes(t)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${TAG_ICON[t]}</svg><span>${esc(t)}</span></button>`).join('')}</div>
    ${sym.tags.length || sym.note ? `<input id="sym-note" placeholder="Add a note (optional)" value="${esc(sym.note)}">` : ''}
    <div class="overall"><span>Overall</span>${Object.keys(FEEL_SHORT).map(k => `<button class="ov ${k} ${feel === k ? 'sel' : ''}" data-feel="${k}" aria-pressed="${feel === k}">${FEEL_SHORT[k]}</button>`).join('')}</div>
  </div>
  ${logged ? `<div class="card tappable" data-day="${today}"><div class="label">Today's entries · tap to edit</div>${info.entries.map(entryHtml).join('')}</div>` : ''}
  ${backupLine}
  <div style="height:64px"></div>
  <button class="fab" id="fab" aria-label="Log a dose">${ICON.plus}Log</button>`;

  $('#fab').onclick = () => openLog();
  document.querySelectorAll('[data-feel]').forEach(b => b.onclick = () => {
    const k = b.dataset.feel;
    if (S.checkins[today] === k) delete S.checkins[today]; else S.checkins[today] = k;
    buzz(8); save(); renderToday();
  });
  document.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { toggleTag(today, b.dataset.tag); buzz(8); renderToday(); });
  if ($('#sym-note')) debouncedNote($('#sym-note'), today);
  document.querySelectorAll('[data-gap]').forEach(b => b.onclick = () => catchUpAction(b.dataset.gap, b.dataset.d, gaps));
  if ($('#q-take')) $('#q-take').onclick = () => takeBridge(today, p.late ? 'late' : 'scheduled');
  if ($('#q-off')) $('#q-off').onclick = () => saveOff(today);
  if ($('#bk-now')) $('#bk-now').onclick = e => { e.preventDefault(); backup(); };
  if ($('#bk-line')) $('#bk-line').onclick = backup;
}

// ---------- catch-up for days with no entry ----------
function gapDays(today) {
  const f = firstLogged(); if (!f) return [];
  const back = addDays(today, -14);
  const out = [];
  for (let d = back > f ? back : f; d < today; d = addDays(d, 1))
    if (!dayInfo(d).entries.length && !S.skipped[d]) out.push(d);
  return out;
}
function catchUpHtml(gaps) {
  if (!gaps.length) return '';
  const d = gaps[0], rest = gaps.length - 1, plan = planLabel(d);
  return `<div class="card catch">
    <div class="card-title">Catch up: ${fmt(d)}</div>
    <div class="entry">Nothing is logged for this day.${plan ? ' ' + plan + ' (from your log so far).' : ''} The plan depends on an accurate history.</div>
    <div class="catch-actions">
      <button class="secondary" data-gap="take" data-d="${d}">Took 0.125</button>
      <button class="secondary" data-gap="off" data-d="${d}">Off day</button>
      <button class="secondary" data-gap="other" data-d="${d}">Other</button>
    </div>
    <div class="catch-foot"><span class="entry">${rest ? rest + ' more day' + (rest > 1 ? 's' : '') + ' after this' : ''}</span>
      <span>${rest ? `<button class="linkbtn" data-gap="alloff" data-d="${d}">Mark all ${gaps.length} as off</button>` : ''}<button class="linkbtn" data-gap="skip" data-d="${d}">Skip</button></span></div>
  </div>`;
}
async function catchUpAction(kind, d, gaps) {
  if (kind === 'take') { const p = planFor(d); return takeBridge(d, p && p.kind === 'due' ? 'scheduled' : 'other'); }
  if (kind === 'off') return saveOff(d);
  if (kind === 'other') return openLog({ date: d });
  if (kind === 'skip') {
    S.skipped[d] = true; save(); render();
    return showToast('Skipped. You can still fill it in from History.', () => { delete S.skipped[d]; save(); render(); });
  }
  if (kind === 'alloff') {
    const ok = await askConfirm({ title: `Mark ${gaps.length} days as off?`, sub: 'Only if you took nothing on these days.', items: gaps.map(g => fmt(g)), ok: 'Mark as off' });
    if (!ok) return;
    const ids = gaps.map(g => addEntry({ date: g, dose: 0, reason: 'off', note: '' }));
    buzz(); showToast(`Marked ${ids.length} days as off`, () => { S.entries = S.entries.filter(e => !ids.includes(e.id)); save(); render(); });
  }
}

// ---------- sheets, toasts, confirms ----------
const sheetStack = [];
let sheetZ = 30, histMarker = false, suppressPop = 0, releaseTimer = null;
// Give back the history entry only if no new sheet opened right after the last one closed
// (close-then-open in the same moment must not race with history.back()).
function releaseMarker() {
  clearTimeout(releaseTimer);
  releaseTimer = setTimeout(() => {
    if (!sheetStack.length && histMarker) { histMarker = false; suppressPop++; history.back(); }
  }, 80);
}
function makeSheet(html, { onClose } = {}) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const el = document.createElement('div'); el.className = 'sheet';
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = `<div class="grab"></div><div class="sheet-body">${html}</div>`;
  scrim.style.zIndex = ++sheetZ; el.style.zIndex = ++sheetZ;
  document.body.append(scrim, el);
  requestAnimationFrame(() => requestAnimationFrame(() => { scrim.classList.add('show'); el.classList.add('show'); }));
  let closed = false;
  const ctl = {
    el, body: el.querySelector('.sheet-body'),
    set(h) { ctl.body.innerHTML = h; },
    get open() { return !closed; },
    close(fromPop) {
      if (closed) return; closed = true;
      const i = sheetStack.indexOf(ctl); if (i >= 0) sheetStack.splice(i, 1);
      scrim.classList.remove('show'); el.classList.remove('show');
      setTimeout(() => { scrim.remove(); el.remove(); }, 300);
      // One history entry stands in for "a sheet is open", so the Android back button closes the sheet instead of the app.
      if (fromPop) { if (sheetStack.length) history.pushState({ sheet: 1 }, ''); else histMarker = false; }
      else if (!sheetStack.length) releaseMarker();
      if (onClose) onClose();
    },
  };
  scrim.onclick = () => ctl.close();
  sheetStack.push(ctl);
  if (!histMarker) { history.pushState({ sheet: 1 }, ''); histMarker = true; }
  return ctl;
}
window.addEventListener('popstate', () => {
  if (suppressPop > 0) { suppressPop--; return; }
  const top = sheetStack[sheetStack.length - 1];
  if (top) top.close(true);
  else if (histMarker) histMarker = false; // the marker entry was already used up by this back press
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetStack.length) sheetStack[sheetStack.length - 1].close(); });

function askConfirm({ title, sub = '', lines = [], items = [], ok = 'Confirm', cancel = 'Cancel', danger = false }) {
  return new Promise(resolve => {
    let decided = false;
    const done = v => { if (!decided) { decided = true; resolve(v); } };
    const sh = makeSheet(`<div class="sheet-title">${esc(title)}</div>${sub ? `<div class="sheet-sub">${esc(sub)}</div>` : ''}
      ${lines.map(t => noteHtml({ cls: 'warn', t })).join('')}
      ${items.length ? `<div class="list">${items.map(t => `<div>${esc(t)}</div>`).join('')}</div>` : ''}
      <div class="sheet-actions"><button class="primary ${danger ? 'danger-fill' : ''}" data-r="1">${esc(ok)}</button><button class="secondary wide" data-r="0">${esc(cancel)}</button></div>`,
      { onClose: () => done(false) });
    sh.el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { done(b.dataset.r === '1'); sh.close(); });
  });
}

let toastTimer = null;
function showToast(text, undo) {
  const t = $('#toast');
  t.innerHTML = `<span class="tmsg">${undo ? ICON.checkAnim : ''}<span>${esc(text)}</span></span>${undo ? '<button id="t-undo">Undo</button>' : ''}`;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), undo ? 6000 : 3500);
  if (undo) $('#t-undo').onclick = () => { undo(); t.classList.remove('show'); };
}

// ---------- saving ----------
const autoRemoved = {};
function addEntry(e) {
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  if (e.dose > EPS) {
    const offs = S.entries.filter(x => x.date === e.date && x.reason === 'off');
    if (offs.length) { autoRemoved[id] = offs; S.entries = S.entries.filter(x => !offs.includes(x)); }
  }
  S.entries.push({ id, at: new Date().toISOString(), ...e });
  sortEntries();
  justSaved = true;
  save(); render();
  return id;
}
function removeEntry(id) {
  S.entries = S.entries.filter(e => e.id !== id);
  if (autoRemoved[id]) { S.entries.push(...autoRemoved[id]); delete autoRemoved[id]; sortEntries(); }
  save(); render();
}
async function takeBridge(date, reason, { forceConfirm = false, sub = '' } = {}) {
  const w = checks(date, 0.125, reason);
  if (w.length || forceConfirm) {
    const ok = await askConfirm({ title: w.length ? 'Heads up' : 'Log 0.125 mg for today?', sub: w.length ? 'This dose breaks a plan rule. You can still save it.' : sub, lines: w, ok: w.length ? 'Save anyway' : 'Log it' });
    if (!ok) return;
  }
  const id = addEntry({ date, dose: 0.125, reason, note: '' });
  buzz(); showToast(`Saved: 0.125 mg ${date === logicalToday() ? 'today' : 'on ' + fmt(date)}`, () => removeEntry(id));
}
function saveOff(date) {
  const id = addEntry({ date, dose: 0, reason: 'off', note: '' });
  buzz(); showToast(`Saved: off day${date === logicalToday() ? '' : ' on ' + fmt(date)}`, () => removeEntry(id));
}

// ---------- log sheet ----------
function openLog(opts = {}) {
  const today = logicalToday();
  const lg = { key: opts.preset || '', amount: '', note: '', reason: null, date: opts.date || today, noSleep: false, more: false };
  const sh = makeSheet('');
  const preset = () => PRESETS[lg.key];
  const doseOf = () => { const p = preset(); return !p ? NaN : p.dose != null ? p.dose : parseFloat(lg.amount); };
  const reasonOf = () => lg.reason || (preset() ? preset().reason : null);
  const REASON_CHOICES = ['scheduled', 'sos', 'sleep', 'tremor', 'late', 'other'];

  const sync = () => {
    const g = id => sh.el.querySelector('#' + id);
    if (g('lg-amt')) lg.amount = g('lg-amt').value;
    if (g('lg-note')) lg.note = g('lg-note').value;
    if (g('lg-date')) lg.date = g('lg-date').value;
    if (g('lg-reason')) lg.reason = g('lg-reason').value;
  };
  const warnings = () => {
    const d = doseOf(), r = reasonOf();
    if (!(d > 0) || !lg.date || r === 'othermed') return [];
    return checks(lg.date, d, r);
  };
  const updateWarn = () => {
    const w = warnings(), el = sh.el.querySelector('#lg-warn'), btn = sh.el.querySelector('#lg-save');
    if (!el || !btn) return;
    el.innerHTML = w.map(t => noteHtml({ cls: 'bad', t })).join('');
    btn.textContent = w.length ? 'Save anyway' : 'Save';
    btn.classList.toggle('warnbtn', w.length > 0);
  };
  const err = t => { const el = sh.el.querySelector('#lg-err'); if (el) el.innerHTML = noteHtml({ cls: 'bad', t }); };
  const draw = () => {
    const p = preset();
    sh.set(`
      <div class="sheet-title">Log a dose</div>
      <div class="sheet-sub">${fmt(lg.date)}${lg.date === today ? ' (today)' : ''}</div>
      <div class="chips">${Object.entries(PRESETS).map(([k, v]) => `<button class="chip-btn ${lg.key === k ? 'sel' : ''}" data-k="${k}"><b>${v.label}</b><span>${v.sub}</span></button>`).join('')}</div>
      ${p ? `
        ${p.amount ? `<label class="f">Amount (mg)<input id="lg-amt" type="number" inputmode="decimal" step="0.0625" min="0" value="${esc(lg.amount)}"></label>` : ''}
        <label class="f">${p.name ? 'Medication name' : 'Note (optional)'}<input id="lg-note" value="${esc(lg.note)}" placeholder="${p.name ? 'e.g. Rize' : 'What happened?'}"></label>
        <details class="more" ${lg.more || lg.noSleep || lg.date !== today ? 'open' : ''}><summary>Different day, or change the reason</summary>
          <label class="f" style="display:flex;gap:10px;align-items:center;color:var(--text)">
            <input id="lg-noslept" type="checkbox" style="width:22px;height:22px;margin:0" ${lg.noSleep ? 'checked' : ''}> Haven't slept yet (counts for the previous day)</label>
          <label class="f">Date (before 6 AM counts as the previous day)<input id="lg-date" type="date" value="${lg.date}" max="${ymd(new Date())}"></label>
          ${p.reason === 'othermed' ? '' : `<label class="f">Reason<select id="lg-reason">${REASON_CHOICES.map(k => `<option value="${k}" ${reasonOf() === k ? 'selected' : ''}>${REASONS[k]}</option>`).join('')}</select></label>`}
        </details>
        <div id="lg-err"></div><div id="lg-warn"></div>
        <div class="sheet-actions"><button class="primary" id="lg-save">Save</button></div>` : '<div class="empty">Pick what you took.</div>'}`);
    sh.el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { sync(); lg.key = b.dataset.k; lg.reason = null; draw(); });
    ['lg-amt', 'lg-note', 'lg-date', 'lg-reason'].forEach(id => { const el = sh.el.querySelector('#' + id); if (el) el.oninput = () => { sync(); const e = sh.el.querySelector('#lg-err'); if (e) e.innerHTML = ''; updateWarn(); }; });
    const ns = sh.el.querySelector('#lg-noslept');
    if (ns) ns.onchange = () => { sync(); lg.noSleep = ns.checked; lg.more = true; lg.date = ns.checked ? addDays(ymd(new Date()), -1) : today; draw(); };
    const sv = sh.el.querySelector('#lg-save');
    if (sv) sv.onclick = save_;
    updateWarn();
  };
  const save_ = () => {
    sync();
    const d = doseOf(), r = reasonOf();
    if (!(d > 0)) return err('Enter an amount in mg.');
    if (!lg.date) return err('Pick a date.');
    if (lg.date > ymd(new Date())) return err('That date is in the future.');
    if (r === 'othermed') {
      if (!lg.note.trim()) return err('Type the medication name.');
      const id = addEntry({ date: lg.date, dose: 0, reason: 'othermed', note: `${num(d)} mg ${lg.note.trim()}` });
      sh.close(); buzz(); showToast(`Saved note: ${num(d)} mg ${lg.note.trim()}`, () => removeEntry(id));
      return;
    }
    const date = lg.date;
    const id = addEntry({ date, dose: d, reason: r, note: lg.note.trim() });
    sh.close(); buzz();
    showToast(`Saved: ${mg(d)}${date !== today ? ' on ' + fmt(date) : ' today'}`, () => removeEntry(id));
  };
  draw();
  return sh;
}

// ---------- day sheet: see, add, edit, delete ----------
function planLabel(date) {
  const today = logicalToday();
  if (date > today) {
    const pr = projection(today, diffDays(today, date) + 1);
    return date in pr ? (pr[date] ? 'Planned: 0.125 mg' : 'Planned: off day') : '';
  }
  const p = planFor(date);
  if (!p || p.kind === 'before') return '';
  return p.kind === 'due' ? (p.head.includes(' or ') ? 'Plan: 0.125 or off' : 'Plan: 0.125 mg') : 'Plan: off day';
}
function entryParts(e) {
  const dt = new Date(e.at);
  const t = e.reason === 'backfill' || isNaN(dt) ? '' : dt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const reason = e.reason === 'backfill' ? 'Backfilled' : REASONS[e.reason] || e.reason;
  if (e.dose > 0) return { main: mg(e.dose), sub: [reason, e.note, t && 'logged ' + t].filter(Boolean).join(' · ') };
  if (e.reason === 'othermed') return { main: e.note || 'Other medication', sub: 'Other medication, not counted' + (t ? ' · logged ' + t : '') };
  return { main: 'Off day confirmed', sub: t ? 'logged ' + t : '' };
}
function entryHtml(e) {
  const { main, sub } = entryParts(e);
  return `<div class="entry"><b style="color:var(--text)">${esc(main)}</b>${sub ? ' · ' + esc(sub) : ''}</div>`;
}
function openDay(startDate) {
  let date = startDate;
  const sh = makeSheet('');
  const draw = () => {
    if (!sh.open) return;
    const today = logicalToday(), future = date > today;
    const info = dayInfo(date);
    const total = info.entries.length ? (info.total > EPS ? mg(info.total) : 'No dose') : 'Not logged';
    const plan = planLabel(date);
    const fl = S.checkins[date];
    sh.set(`
      <div class="sheet-title">${fmt(date)}${date === today ? ' (today)' : ''}</div>

// ---------- backup / restore / export ----------
async function shareOrDownload(name, text, type) {
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return true;
    }
  } catch (e) {
    if (e.name === 'AbortError') return false;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}
async function backup() {
  const name = `dose-log-backup-${logicalToday()}.json`;
  const ok = await shareOrDownload(name, JSON.stringify({ app: 'doselog', version: 1, exportedAt: new Date().toISOString(), data: S }, null, 2), 'application/json');
  if (!ok) return;
  const saved = await askConfirm({ title: 'Did the backup save?', sub: 'In Drive you have to tap Save. If you saw it upload, or can find the file in Drive, choose yes.', ok: 'Yes, it saved', cancel: 'No, not saved' });
  if (saved) { S.settings.lastBackup = new Date().toISOString(); save(); render(); buzz(); showToast('Backup recorded'); }
  else showToast('Backup not recorded. Tap Back up to try again.');
}

  const from = win && addDays(today, -(win - 1)) > first ? addDays(today, -(win - 1)) : first;
  const nDays = diffDays(from, today) + 1, f1 = firstLogged();
  let total = 0, bridge = 0, high = 0, dosed = 0, highDays = 0, vhighDays = 0, sosDays = 0, sleepDays = 0, unlogged = 0, checked = 0;
  const feel = { ok: 0, some: 0, rough: 0 }, tagN = {}, others = [];
  for (let d = from; d <= today; d = addDays(d, 1)) {
    const i = dayInfo(d);
    if (!i.entries.length && f1 && d >= f1 && d < today && !S.skipped[d]) unlogged++;
    total += i.total;
    if (i.type === 'bridge') bridge += i.total; else if (isHigh(i.type)) { high += i.total; highDays++; if (i.type === 'vhigh') vhighDays++; }
    if (i.total > EPS) dosed++;
    if (i.entries.some(e => e.reason === 'sos')) sosDays++;
    if (i.entries.some(e => e.reason === 'sleep')) sleepDays++;
    i.entries.filter(e => e.reason === 'othermed').forEach(e => others.push(`${d}: ${e.note}`));
    if (S.checkins[d]) { feel[S.checkins[d]]++; checked++; }
    symOf(d).tags.forEach(t => { tagN[t] = (tagN[t] || 0) + 1; });
  }
  const label = range === 'all' ? 'all days' : range === 'sum' ? 'summary only, last 28 days' : `last ${range} days`;
  const lines = [`DOSE LOG (${st.medName}), exported ${today}, ${label}`,
    `Plan start: ${st.startDate}. Current interval: ${intervalName(intervalOn(today))}.`,
    `Interval history: ${[...st.intervals].sort((a, b) => a.from.localeCompare(b.from)).map(i => `${i.from} ${intervalName(i.every)}`).join('; ')}`,
    '', `SUMMARY (${from} to ${today}, ${nDays} days)`,
    `Total: ${num(total)} mg (bridge days ${num(bridge)}, high days ${num(high)}). About ${num(total / nDays * 7)} mg per 7 days.`,
    `Days dosed: ${dosed} of ${nDays}. High days: ${highDays} (SOS ${sosDays}, sleep exception ${sleepDays}). Very high days: ${vhighDays}.`,
    `Days not logged: ${unlogged}.`,
    `Other medication notes: ${others.length ? others.join('; ') : 'none'}.`,
    `Check-ins: ${checked} of ${nDays} days. Felt OK ${feel.ok}, some symptoms ${feel.some}, rough ${feel.rough}.`];
  const tagLine = SYMPTOM_TAGS.filter(t => tagN[t]).map(t => `${t} ${tagN[t]}`).join(', ');
  if (tagLine) lines.push(`Tags: ${tagLine}.`);
  if (range !== 'sum') {
    lines.push('', 'date | total mg | entries (dose, reason, note, time logged)');
    for (let d = from; d <= today; d = addDays(d, 1)) {
      const i = dayInfo(d), sy = S.symptoms[d];
      const es = i.entries.filter(e => e.dose > 0 || e.note).map(e => e.dose === 0 ? `note: "${e.note}"` :
        `${e.dose} ${REASONS[e.reason] || e.reason}${e.note ? ' "' + e.note + '"' : ''}${e.reason === 'backfill' ? '' : ' @' + new Date(e.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
      const none = !i.entries.length;
      const extra = (S.checkins[d] ? ' | felt: ' + FEELINGS[S.checkins[d]] : '') + (sy && sy.tags.length ? ' | tags: ' + sy.tags.join(', ') : '') + (sy && sy.note ? ` | note: "${sy.note}"` : '');
      lines.push(`${d} | ${none ? '-' : +i.total.toFixed(4)} | ${es.join('; ') || (i.entries.length ? 'off (confirmed)' : d === today ? 'not logged yet' : S.skipped[d] ? 'skipped' : 'not logged')}${extra}`);
    }
  }
  const ws = warningSigns(today);
  lines.push('', `WARNING SIGNS (per plan, counted from plan start ${st.startDate})`,
    `Tremor doses, last 30 days: ${ws.tremor30} (flag at 2)`,
    `Very high days since plan start: ${ws.vhigh} (flag above 1)`,
    `3+ high days in 7 days, not one run: ${ws.cluster ? 'yes, latest ' + ws.cluster : 'no'}`,
    `High days per 28-day block, oldest to now: ${ws.blocks.map(b => b === null ? 'n/a (before plan start)' : b).join(', ')}${ws.rising ? ' (rising, flagged)' : ''}`,
    `Sleep exceptions, last 30 days: ${sleepDaysIn(today, 30)} (max 2)`);
  if (range === 'all') {
    const ms = monthlyData(today);
    if (ms.length > 1) {
      lines.push('', 'BY MONTH (mg, mg per 7 days, days dosed, high days)');
      ms.forEach(m => lines.push(`${m.key}${m.partial ? ' (partial)' : ''}: ${num(m.total)} mg, ${m.counted ? num(m.per7) : 'n/a'} per 7 days (logged days only), ${m.dosed}/${m.counted} logged days dosed, ${m.high} high days${m.vhigh ? ` (${m.vhigh} very high)` : ''}${m.unlogged ? `, ${m.unlogged} not logged` : ''}`));
    }
  }
  lines.push('', 'WEEKLY TOTALS (Mon to Sun, mg)');
  weeklyData(today, 520).filter(w => addDays(w.start, 6) >= from).forEach(w => lines.push(`Week of ${w.start}${w.partial ? ' (partial)' : ''}: ${num(w.total)} total (bridge ${num(w.bridge)}, high ${num(w.high)}), ${w.dosed}/${w.logged} days dosed${w.unlogged ? `, ${w.unlogged} not logged` : ''}`));
  return lines.join('\n');
}
function openCopy() {
  const sh = makeSheet(`
    <div class="sheet-title">Copy log</div>
    <div class="sheet-sub">A summary is always at the top. Pick how many daily lines to include.</div>
    <div class="chips">
      <button class="chip-btn" data-r="14"><b>Last 14 days</b><span>Summary + daily lines</span></button>
      <button class="chip-btn" data-r="30"><b>Last 30 days</b><span>Summary + daily lines</span></button>
      <button class="chip-btn" data-r="all"><b>Everything</b><span>Since the start</span></button>
      <button class="chip-btn" data-r="sum"><b>Summary only</b><span>Last 28 days, no daily lines</span></button>
    </div>`);
  sh.el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { const r = b.dataset.r; sh.close(); copyLog(r === 'all' || r === 'sum' ? r : +r); });
}
async function copyLog(range = 'all') {
  const t = logText(range);
  try { await navigator.clipboard.writeText(t); buzz(); showToast('Copied. Paste it into your chat or note.'); }
  catch (e) { shareOrDownload(`dose-log-${logicalToday()}.txt`, t, 'text/plain'); }
}
function exportCsv() {
  const q = v => `"${String(v).replace(/"/g, '""')}"`, today = logicalToday();
  const first = S.entries.length ? S.entries[0].date : S.settings.startDate;
  const rows = [['date', 'status', 'total_mg', 'doses_mg', 'reasons', 'entry_notes', 'felt', 'tags', 'day_note'].join(',')];
  for (let d = first; d <= today; d = addDays(d, 1)) {
    const i = dayInfo(d), sy = S.symptoms[d];
    const doses = i.entries.filter(e => e.dose > 0);
    const status = !i.entries.length ? (d === today ? 'not logged yet' : S.skipped[d] ? 'skipped' : 'not logged') : i.total > EPS ? 'dosed' : i.entries.some(e => e.reason === 'othermed') ? 'other medication only' : 'off';
    rows.push([d, status, i.entries.length ? +i.total.toFixed(4) : '', doses.map(e => e.dose).join(' + '), q(i.entries.map(e => REASONS[e.reason] || e.reason).join('; ')),
      q(i.entries.map(e => e.note).filter(Boolean).join(' | ')), S.checkins[d] ? FEELINGS[S.checkins[d]] : '', q(sy ? sy.tags.join('; ') : ''), q(sy ? sy.note : '')].join(','));
  }
  shareOrDownload(`dose-log-${today}.csv`, rows.join('\n'), 'text/csv');
}
function restore(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const j = JSON.parse(r.result);
      const data = j.data || j;
      if (!Array.isArray(data.entries) || !data.settings) throw new Error('Not a Dose Log backup file.');
      const ok = await askConfirm({ title: 'Replace the log on this phone?', sub: `Backup from ${j.exportedAt ? fmt(logicalOf(j.exportedAt)) : 'the file'} with ${data.entries.length} entries replaces what is here now.`, ok: 'Replace', danger: true });
      if (!ok) return;
      S = migrate(data); save(); tab = 'today'; render(); showToast('Restored');
    } catch (e) { showToast('Could not restore: ' + e.message); }
  };
  r.readAsText(f);
  ev.target.value = '';
}

// ---------- import link (#import=<base64url JSON [[date, dose, reason, note], ...]>) ----------
// Accepts rows [[date, dose, reason, note], ...] or a compact run {s: startDate, d: [dose per day...], n: [extra rows]}.
function expandImport(raw) {
  const isDate = x => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x) && !isNaN(parse(x));
  let rows;
  if (Array.isArray(raw)) rows = raw;
  else if (raw && isDate(raw.s) && Array.isArray(raw.d) && raw.d.length <= 800)
    rows = raw.d.map((v, i) => [addDays(raw.s, i), v, v > 0 ? 'backfill' : 'off', '']).concat(Array.isArray(raw.n) ? raw.n : []);
  else throw new Error('bad data');
  if (!rows.length || rows.length > 900 || !rows.every(r => Array.isArray(r) && isDate(r[0]) && typeof r[1] === 'number' && r[1] >= 0 && r[1] <= 2)) throw new Error('bad data');
  return rows;
}
async function importFromHash() {
  const m = location.hash.match(/^#import=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  let rows;
  try { rows = expandImport(JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))))); }
  catch (e) { showToast('That import link is not valid.'); return; }
  // Only days with no entry are filled in. Anything already logged is kept exactly as it is.
  const plan = () => {
    S = load();
    const have = new Set(S.entries.map(e => e.date));
    return {
      add: rows.filter(r => !have.has(r[0])),
      conflicts: rows.filter(r => have.has(r[0]) && r[2] !== 'othermed' && Math.abs(dayInfo(r[0]).total - r[1]) > EPS),
    };
  };
  const p1 = plan();
  if (!p1.add.length) { showToast(p1.conflicts.length ? `Nothing added. ${p1.conflicts.length} days differ from your log, so yours were kept.` : 'Those days are already in your log.'); return; }
  const dates = p1.add.map(r => r[0]).sort();
  const sum = p1.add.reduce((a, r) => a + (r[2] === 'othermed' ? 0 : r[1]), 0);
  const items = p1.add.length <= 12 ? p1.add.map(r => `${fmt(r[0])}: ${r[1] > 0 ? r[1] + ' mg' : (r[3] || 'off')}`)
    : [`${p1.add.length} entries, ${fmt(dates[0])} to ${fmt(dates[dates.length - 1])}`, `${p1.add.filter(r => r[1] > 0).length} dose days, ${p1.add.filter(r => r[1] === 0 && r[2] !== 'othermed').length} off days`, `${num(sum)} mg in total`];
  const lines = p1.conflicts.length ? [`${p1.conflicts.length} day${p1.conflicts.length > 1 ? 's are' : ' is'} already logged differently and will be kept as you logged ${p1.conflicts.length > 1 ? 'them' : 'it'}: ${p1.conflicts.slice(0, 5).map(r => `${short(r[0])} (yours ${num(dayInfo(r[0]).total)}, link ${num(r[1])})`).join(', ')}${p1.conflicts.length > 5 ? '…' : ''}`] : [];
  const ok = await askConfirm({ title: `Add ${p1.add.length} entr${p1.add.length === 1 ? 'y' : 'ies'} to your log?`, sub: 'Only days with no entry are filled in. Anything you already logged stays as it is.', lines, items, ok: 'Add' });
  if (!ok) return;
  const p2 = plan(); // latest saved data, in case anything changed while the sheet was open
  const now = new Date().toISOString();
  p2.add.forEach((r, i) => S.entries.push({ id: Date.now().toString(36) + i, at: now, date: r[0], dose: +r[1], reason: r[2] || 'other', note: r[3] || '' }));
  sortEntries(); save(); render(); showToast(`Added ${p2.add.length} entr${p2.add.length === 1 ? 'y' : 'ies'}`);
}

// ---------- launch shortcuts (long-press the app icon) ----------
async function handleLaunchAction() {
  const action = new URLSearchParams(location.search).get('action');
  if (!action) return;
  history.replaceState(null, '', location.pathname + location.hash);
  if (!S.settings.startDate) return;
  tab = 'today'; render();
  const today = logicalToday();
  if (action === 'sos') { openLog({ preset: 'sos' }); return; }
  if (dayInfo(today).entries.length) { showToast('Already logged today. Tap the day to edit.'); return; }
  if (action === 'take') {
    const p = planFor(today);
    await takeBridge(today, p && p.late ? 'late' : 'scheduled', { forceConfirm: true, sub: p ? p.text : '' });
  } else if (action === 'off') {
    if (await askConfirm({ title: 'Confirm today as an off day?', ok: 'Confirm' })) saveOff(today);
  }
}

// ---------- boot ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
// Reload saved data whenever the app comes back to the front or another tab saves,
// so a stale copy in memory never overwrites newer entries.
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S = load(); render(); } });
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('hashchange', () => { importFromHash(); render(); });
render();
importFromHash();
handleLaunchAction();
</script>
</body>
