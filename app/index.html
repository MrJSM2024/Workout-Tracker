<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dose Log</title>
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f3f2ee; --card: #ffffff; --raised: #f8f7f4; --text: #18201b; --muted: #6b736d; --faint: #9aa19c; --line: #e7e6e1;
    --accent: #1f7a4d; --accent-strong: #145a37; --accent-soft: #e3f1e8; --on-accent: #ffffff;
    --warn: #9a5b06; --warn-soft: #fbf0dc; --bad: #b42318; --bad-soft: #fde7e4; --sos: #6d3fd9; --sos-soft: #efe9fd;
    --c-bridge: #16a34a; --c-high: #7c3aed; --grid: #e7e6e1;
    --shadow: 0 1px 2px rgba(24,32,27,.05), 0 6px 20px rgba(24,32,27,.06);
    --hero-dose: linear-gradient(150deg, #1f7a4d 0%, #145a37 100%);
    --hero-off: linear-gradient(150deg, #ffffff 0%, #f1f4f1 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d110f; --card: #161b18; --raised: #1c221e; --text: #e9eeea; --muted: #9aa59e; --faint: #6c766f; --line: #252c27;
      --accent: #4cc38a; --accent-strong: #2f9e68; --accent-soft: #15301f; --on-accent: #062012;
      --warn: #f2b53c; --warn-soft: #33270b; --bad: #f38b80; --bad-soft: #3a1714; --sos: #a78bfa; --sos-soft: #251c40;
      --c-bridge: #16a34a; --c-high: #8b5cf6; --grid: #252c27;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
      --hero-dose: linear-gradient(150deg, #1d6b45 0%, #10432a 100%);
      --hero-off: linear-gradient(150deg, #1a201c 0%, #151a17 100%);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; }
  header { max-width: 560px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 20px 4px; }
  header .eyebrow { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  header h1 { font-size: 30px; line-height: 1.15; margin: 2px 0 0; letter-spacing: -.02em; }
  main { padding: 0 16px calc(104px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 4px;
    background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); z-index: 5; }
  nav button { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px;
    border: 0; background: none; color: var(--faint); font-size: 12px; font-weight: 600; border-radius: 14px; }
  nav button svg { width: 24px; height: 24px; padding: 2px 14px; box-sizing: content-box; border-radius: 999px; }
  nav button.on { color: var(--text); }
  nav button.on svg { background: var(--accent-soft); color: var(--accent); }

  .card { background: var(--card); border-radius: 20px; padding: 18px; margin: 14px 0; box-shadow: var(--shadow); }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
  .card-title { font-size: 17px; font-weight: 700; margin: 0 0 2px; }
  .plan-text { color: var(--muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .entry { font-size: 13px; color: var(--muted); }
  .entry button { border: 0; background: none; color: var(--bad); font-size: 13px; padding: 8px 6px; margin: -6px 0; }
  .hidden { display: none !important; }

  /* hero */
  .hero { border-radius: 26px; padding: 22px 20px 18px; margin: 14px 0; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .hero.dose { background: var(--hero-dose); color: #fff; }
  .hero.off, .hero.done { background: var(--hero-off); color: var(--text); }
  .hero .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; opacity: .75; }
  .hero h2 { font-size: 40px; line-height: 1.05; margin: 6px 0 6px; letter-spacing: -.03em; font-weight: 800; }
  .hero h2 small { font-size: 22px; font-weight: 700; letter-spacing: -.01em; opacity: .85; }
  .hero .sub { font-size: 15px; opacity: .85; }
  .hero .chip { display: block; margin-top: 10px; padding: 9px 12px; border-radius: 12px; font-size: 14px; }
  .hero.dose .chip { background: rgba(255,255,255,.14); color: #fff; }
  .hero.off .chip, .hero.done .chip { background: var(--raised); color: var(--muted); }
  .hero .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .hero .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .hero .chip.ok { background: var(--accent-soft); color: var(--accent); }
  .hero .done-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 6px 12px 6px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; }
  .hero.dose .done-badge { background: rgba(255,255,255,.18); color: #fff; }
  .quick { display: flex; gap: 10px; margin-top: 16px; }
  .btn-hero { flex: 1; min-height: 54px; border-radius: 16px; border: 0; font-size: 17px; font-weight: 800; }
  .hero.dose .btn-hero { background: #fff; color: #145a37; }
  .hero.dose .btn-hero.ghost { background: rgba(255,255,255,.14); color: #fff; }
  .hero.off .btn-hero, .hero.done .btn-hero { background: var(--accent); color: var(--on-accent); }

  /* 7-day timeline */
  .timeline { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(127,127,127,.18); }
  .tl { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; }
  .tl .wd { opacity: .6; }
  .tl .dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
  .tl .d-bridge { background: var(--c-bridge); color: #fff; }
  .tl .d-high { background: var(--c-high); color: #fff; }
  .hero.dose .tl .d-bridge, .hero.dose .tl .d-high { box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
  .tl .d-off { background: transparent; }
  .tl .d-off::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .35; }
  .tl .d-plan { border: 2px dashed currentColor; opacity: .75; }
  .tl .d-none { opacity: .3; }
  .tl.today .dn { padding: 1px 7px; border-radius: 999px; background: currentColor; }
  .hero.dose .tl.today .dn { background: #fff; color: #145a37; }
  .hero.off .tl.today .dn, .hero.done .tl.today .dn { background: var(--text); color: var(--card); }
  .tl-legend { display: flex; justify-content: center; gap: 14px; margin-top: 10px; font-size: 11px; opacity: .7; }
  .tl-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  /* feeling segmented control */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .feel { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 14px;
    border: 2px solid transparent; background: var(--raised); color: var(--muted); font-size: 13px; font-weight: 700; }
  .feel svg { width: 28px; height: 28px; }
  .feel.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .feel.sel.rough { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }

  /* forms */
  .dose-btn { flex: 1 1 28%; min-height: 60px; border-radius: 14px; border: 2px solid transparent; background: var(--raised);
    color: var(--text); font-size: 19px; font-weight: 800; }
  .dose-btn small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); }
  .dose-btn.sel { border-color: var(--accent); background: var(--accent-soft); }
  select, input, textarea { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--raised); color: var(--text); outline: none; }
  select:focus, input:focus { border-color: var(--accent); }
  label.f { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); font-weight: 600; }
  label.f input, label.f select { margin-top: 6px; }
  .primary { width: 100%; margin-top: 16px; min-height: 54px; border: 0; border-radius: 16px; background: var(--accent);
    color: var(--on-accent); font-size: 17px; font-weight: 800; }
  .secondary { padding: 12px 16px; border-radius: 14px; border: 0; background: var(--raised); color: var(--text); font-weight: 700; }
  details.logform > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  details.logform > summary::-webkit-details-marker { display: none; }
  details.logform > summary .chev { width: 32px; height: 32px; border-radius: 50%; background: var(--raised); display: flex;
    align-items: center; justify-content: center; transition: transform .2s; color: var(--muted); flex: none; }
  details.logform[open] > summary .chev { transform: rotate(180deg); }
  details.more > summary { color: var(--muted); font-weight: 600; font-size: 14px; margin-top: 14px; }
  details summary { cursor: pointer; }

  .note { padding: 10px 12px; border-radius: 12px; margin-top: 10px; font-size: 14px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.bad { background: var(--bad-soft); color: var(--bad); }
  .note.ok { background: var(--accent-soft); color: var(--accent); }
  .note.info { background: var(--raised); color: var(--muted); }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 16px;
    background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; margin-top: 10px; }
  .banner button { border: 0; background: var(--warn); color: var(--card); border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 13px; }

  /* toast */
  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto;
    background: var(--text); color: var(--card); border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between;
    align-items: center; gap: 10px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 10; }
  #toast.hidden { display: none; }
  #toast button { border: 0; background: none; color: var(--accent-soft); font-weight: 800; padding: 4px; text-decoration: underline; }

  /* history */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
  .cal .h { font-size: 11px; color: var(--faint); text-align: center; font-weight: 700; }
  .cal .c { aspect-ratio: 1; border-radius: 10px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    background: var(--raised); color: var(--faint); position: relative; }
  .cal .c.bridge { background: var(--c-bridge); color: #fff; }
  .cal .c.high { background: var(--c-high); color: #fff; }
  .cal .c.over { background: var(--bad); color: #fff; }
  .cal .c.today { outline: 2px solid var(--text); outline-offset: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .wk-head { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 4px 6px; }
  .wk-head b { font-size: 15px; }
  .wk-head span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .day-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .day-row:last-child { border-bottom: 0; }
  .day-num { width: 42px; text-align: center; flex: none; }
  .day-num b { display: block; font-size: 20px; line-height: 1; }
  .day-num span { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  .day-body { flex: 1; min-width: 0; }
  .pill { display: inline-block; min-width: 58px; text-align: center; padding: 5px 9px; border-radius: 999px; font-weight: 800; font-size: 13px; flex: none; }
  .p-off { background: var(--raised); color: var(--faint); }
  .p-bridge { background: var(--accent-soft); color: var(--accent); }
  .p-high { background: var(--sos-soft); color: var(--sos); }
  .p-over { background: var(--bad-soft); color: var(--bad); }
  .feel-tag { display: table; margin-bottom: 3px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--raised); color: var(--muted); margin-left: 6px; }
  .feel-tag.rough { background: var(--warn-soft); color: var(--warn); }

  /* trends */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .kpi { background: var(--card); border-radius: 18px; padding: 14px 12px; box-shadow: var(--shadow); }
  .kpi b { display: block; font-size: 22px; line-height: 1.15; letter-spacing: -.02em; white-space: nowrap; }
  .kpi b small { font-size: 12px; color: var(--muted); font-weight: 700; }
  .kpi span { display: block; margin-top: 2px; }
  .kpi span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .sign { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .sign:last-child { border-bottom: 0; }
  .sign .ic { width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; }
  .sign .ic.okc { background: var(--accent-soft); color: var(--accent); }
  .sign .ic.flagc { background: var(--bad-soft); color: var(--bad); }
  .sign .t { flex: 1; font-size: 14px; }
  .sign .t small { display: block; color: var(--muted); font-size: 12px; }
  .sign .v { font-weight: 800; white-space: nowrap; }
  .sign .v.flag { color: var(--bad); }
  .steps { display: flex; gap: 6px; margin: 12px 0 4px; }
  .steps div { flex: 1; text-align: center; padding: 8px 2px; border-radius: 12px; background: var(--raised); color: var(--faint); font-size: 12px; font-weight: 800; }
  .steps div.done { background: var(--accent-soft); color: var(--accent); }
  .steps div.cur { background: var(--accent); color: var(--on-accent); }
  .bar { height: 10px; border-radius: 999px; background: var(--raised); overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  .stat { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .stat:last-child { border-bottom: 0; }
  .stat b { white-space: nowrap; padding-left: 8px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-size: 10px; }
  .chart .val { fill: var(--text); font-weight: 700; }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .bg { fill: transparent; }
  .chart .bg.on { fill: var(--grid); opacity: .6; }
  .readout { font-size: 14px; min-height: 20px; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--raised); }
  table.wk { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.wk th, table.wk td { text-align: right; padding: 6px 2px; border-bottom: 1px solid var(--line); }
  table.wk th:first-child, table.wk td:first-child { text-align: left; }

  /* settings */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .tile { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; border-radius: 16px; border: 0;
    background: var(--raised); color: var(--text); font-weight: 700; font-size: 15px; text-align: left; }
  .tile svg { width: 22px; height: 22px; color: var(--accent); }
  .tile small { font-weight: 500; color: var(--muted); font-size: 12px; }
  .tile.main { grid-column: span 2; flex-direction: row; align-items: center; background: var(--accent); color: var(--on-accent); }
  .tile.main svg, .tile.main small { color: var(--on-accent); opacity: .9; }
  .rules p, .rules li { font-size: 14px; }
  .rules li { margin-bottom: 6px; }
  .danger { width: 100%; padding: 14px; border-radius: 16px; border: 1.5px solid var(--bad-soft); background: none; color: var(--bad); font-weight: 700; }
  .version { text-align: center; font-size: 12px; color: var(--faint); margin: 18px 0 6px; }
</style>
</head>
<body>
<header>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title">Today</h1>
</header>
<main id="app"></main>
<div id="toast" class="hidden"></div>
<nav>
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/></svg>Today</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>History</button>
  <button data-tab="trends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Trends</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>

<script>
'use strict';
// ---------- storage ----------
const KEY = 'doselog.v1';
const EPS = 1e-6;
const REASONS = {
  backfill: 'Backfilled (reason not recorded)',
  scheduled: 'Scheduled bridge (0.125)',
  sos: 'Acute stress (SOS)',
  sleep: 'Sleep exception (acute stress keeping me up)',
  tremor: 'Tremor / tingling / twitching, no trigger',
  late: 'Missed dose, taken late',
  othermed: 'Other medication (not counted in totals)',
  other: 'Other',
};
const FEELINGS = { ok: 'OK', some: 'Some symptoms', rough: 'Rough' };
const APP_VERSION = '2026-10-10';
const FACE = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01" stroke-width="3"/></svg>',
  some: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 15h8"/><path d="M9 9h.01M15 9h.01" stroke-width="3"/></svg>',
  rough: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><path d="M9 9h.01M15 9h.01" stroke-width="3"/></svg>',
};
const ICON = {
  backup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"/><path d="M12 12v9M8 16l4-4 4 4"/></svg>',

  csv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>',

// ---------- dates (local, YYYY-MM-DD) ----------
const pad = n => String(n).padStart(2, '0');

const DAY_CUTOFF_HOUR = 6;

const widenEarliest = () => addDays(S.settings.startDate, 14);

// ---------- derived data ----------
function dayInfo(date) {
  const es = S.entries.filter(e => e.date === date);
  const total = es.reduce((a, e) => a + e.dose, 0);
  return { entries: es, total, sleep: es.some(e => e.reason === 'sleep'),
    tremor: es.some(e => e.reason === 'tremor'), type: dayType(total) };

// Spec 1: off 0, bridge 0.125, high 0.25 to 0.375, very high above 0.375 (0.5 or more).
function dayType(t) { return t > 0.375 + EPS ? 'vhigh' : t >= 0.25 - EPS ? 'high' : t > EPS ? 'bridge' : 'off'; }

}

}
function tremorDaysIn(endDate, days) {

// Another medication yesterday is not counted in totals; the owner decides: off day or 0.125.
function planFor(date) {
  const p = planCore(date);
  const other = dayInfo(addDays(date, -1)).entries.filter(e => e.reason === 'othermed');
  if (p && p.kind === 'due' && other.length) {
    p.head = '0.125 or off';
    p.notes = [{ cls: 'warn', t: `Yesterday: ${other.map(e => e.note).join(', ')} (other medication, not counted). Your call: off day or 0.125.` }, ...(p.notes || [])];
  }

}
// What the plan says for `date`, based only on days before it.
function planCore(date) {
  const st = S.settings;
  if (!st.startDate) return null;
  if (date < st.startDate) return { kind: 'before', head: '—', text: `Plan starts ${fmt(st.startDate)}.` };
  const every = intervalOn(date);
  const L = lastDosedBefore(date);
  if (!L) return { kind: 'due', head: '0.125', text: 'No doses logged yet. The normal pattern starts with 0.125.' };
  const gap = diffDays(L, date);
  const last = dayInfo(L);
  const notes = [];

  if (isHigh(last.type)) {
    const run = highRunEnding(L);
    if (gap === 1) {
      if (run.len >= 3) notes.push({ cls: 'bad', t: 'No 4th high day in a row. If the emergency is still going on, get medical advice.' });
      else notes.push({ cls: 'info', t: `Only if the same acute stress continues: 0.25 again (would be day ${run.len + 1} of max 3). Otherwise off.` });
    }
    // Spec 2: at interval "none", nothing follows a high day.
    if (every === 0) return { kind: 'off', head: 'Off', text: `Interval is none. No 0.125 follows the ${mg(last.total)} day on ${fmt(L)}.`, notes };
    const off = Math.max(run.vhigh ? 3 : 2, every - 1);
    if (run.vhigh && gap <= off) notes.push({ cls: 'info', t: `After a very high day: ${off} off days, then 0.125.` });
    if (run.len >= 3 && off === 2 && gap <= off + 1) {
      if (date >= unlockSkip3() && tremorDaysIn(addDays(date, -1), 14) === 0)
        notes.push({ cls: 'info', t: `Option unlocked: after a 3-day run you may skip 3 days instead of 2 (0.125 on ${fmt(addDays(L, 4))}).` });
    }
    if (gap <= off) return { kind: 'off', head: 'Off', text: `Off day ${gap} of ${off} after ${mg(last.total)} on ${fmt(L)}. Next 0.125: ${fmt(addDays(L, off + 1))}.`, notes };
    return dueOrLate(addDays(L, off + 1), date, `Bridge 0.125 after the ${mg(last.total)} day.`, notes);
  }

  const due = addDays(L, every);

function dueOrLate(due, date, text, notes) {

function sleepDaysIn(endDate, days, extraDate) {
  const n = new Set(S.entries.filter(e => e.reason === 'sleep' && e.date <= endDate && diffDays(e.date, endDate) < days).map(e => e.date));
  if (extraDate) n.add(extraDate);
  return n.size;
}

// Hard-limit checks (spec 5) for a date if `extra` dose with `reason` were added. Warns, never blocks.
function checks(date, extra = 0, reason = null) {
  const cur = dayInfo(date);
  const total = cur.total + extra;
  const sleep = cur.sleep || reason === 'sleep';
  const type = dayType(total);
  const w = [];
  if (type === 'vhigh') {
    w.push(`${mg(total)} is a very high day. Not part of the plan: ${Math.max(3, intervalOn(date) - 1)} off days follow, then 0.125.`);
    const n = allDays().filter(d => d !== date && dayInfo(d).type === 'vhigh').length;
    if (n >= 1) w.push('WARNING SIGN: more than one very high day. Reassess the plan.');
  } else if (total > 0.25 + EPS && !sleep) {
    w.push('Above 0.25 in a day is only for the sleep exception (extra 0.25 at night, max 0.375).' +
      (Math.abs(cur.total - 0.125) < EPS ? ' Hard day on a 0.125 day: add only 0.125 (total 0.25).' : ''));
  }
  const prev = dayInfo(addDays(date, -1));
  if (type === 'bridge' && prev.type === 'bridge') w.push('Never 0.125 two days in a row.');
  if (isHigh(type)) {
    let len = 1, d = addDays(date, -1);
    while (isHigh(dayInfo(d).type)) { len++; d = addDays(d, -1); }
    if (len >= 4) w.push('4th high day in a row. If the emergency is still going on, get medical advice.');
    if (extra > 0 && reason !== 'sos' && reason !== 'sleep' && !cur.entries.some(e => e.reason === 'sos' || e.reason === 'sleep'))
      w.push('0.25 is only for genuinely acute stress. Pick "Acute stress (SOS)" as the reason if that is what this is.');
  }
  if (sleep) {
    if (prev.sleep) w.push('Sleep exception: not two nights in a row.');
    const n = sleepDaysIn(date, 30, date);
    if (n > 2) w.push(`Sleep exception used ${n} times in the last 30 days. Max is twice.`);
  }
  if (reason === 'tremor' && extra > 0 && prev.total > EPS)
    w.push('Tremor dose: not allowed when there was any dose yesterday.');

    if (p && p.kind === 'off' && reason !== 'tremor' && reason !== 'sos')

  }

}

// Warning signs (spec 6).
function warningSigns(today) {

  let cluster = null;
  const highs = days.filter(d => isHigh(dayInfo(d).type));
  for (let i = 0; i < highs.length; i++) {
    const win = highs.filter(d => d <= highs[i] && diffDays(d, highs[i]) < 7);
    if (win.length >= 3 && diffDays(win[0], win[win.length - 1]) !== win.length - 1) cluster = highs[i];

  // High-day count per 28-day block ending today: rising two blocks in a row.
  const block = k => days.filter(d => { const g = diffDays(d, today); return g >= 28 * k && g < 28 * (k + 1) && isHigh(dayInfo(d).type); }).length;

  if (!(d > 0)) return alert('Pick a dose first.');
  if (!form.date) return alert('Pick a date.');
  if (form.date > ymd(new Date())) return alert('That date is in the future.');
  if (form.reason === 'othermed') {
    if (!form.note) return alert('Type the medication name in the Note field.');
    const id = addEntry({ date: form.date, dose: 0, reason: 'othermed', note: `${d} mg ${form.note}` });
    form = { dose: null, reason: 'scheduled' };
    showToast(`Saved note: ${d} mg ${S.entries.find(e => e.id === id).note.replace(/^[\d.]+ mg /, '')}`, () => removeEntry(id));
    return;
  }
  const w = checks(form.date, d, form.reason);
  if (w.length && !confirm('Heads up:\n\n• ' + w.join('\n• ') + '\n\nSave anyway?')) return;
  const date = form.date;
  const id = addEntry({ date, dose: d, reason: form.reason, note: form.note || '' });
  form = { dose: null, reason: 'scheduled' };
  showToast(`Saved: ${mg(d)}${date !== logicalToday() ? ' on ' + fmt(date) : ' today'}`, () => removeEntry(id));
}
function addEntry(e) {

  save(); render();
  return id;
}
function entryHtml(e) {

  const reason = e.reason === 'backfill' ? 'backfilled' : REASONS[e.reason] || e.reason;
  const what = e.dose > 0 ? `${mg(e.dose)} · ${esc(reason)}${e.note ? ' · ' + esc(e.note) : ''}` : e.note ? `Note: ${esc(e.note)}` : 'Off day confirmed';
  return `<div class="entry">${what}${t}
    <button data-del="${e.id}">delete</button></div>`;
}
function bindDeletes() {

function firstLogged() { return S.entries.length ? S.entries[0].date : null; }
function pillHtml(total, hasEntries, date) {
  const f = firstLogged();
  if (!hasEntries && (!f || date < f)) return `<span class="pill p-off">not logged</span>`;
  if (hasEntries && total < EPS && dayInfo(date).entries.some(e => e.reason === 'othermed')) return `<span class="pill p-off">other</span>`;
  if (!hasEntries || total < EPS) return `<span class="pill p-off">${hasEntries ? 'off ✓' : 'off'}</span>`;
  const cls = total > 0.25 + EPS ? 'p-over' : total >= 0.25 - EPS ? 'p-high' : 'p-bridge';
  return `<span class="pill ${cls}">${+total.toFixed(4)}</span>`;
}

function renderHistory() {
  const today = logicalToday();
  const f = firstLogged();
  const start = f && f < S.settings.startDate ? f : S.settings.startDate;
  // 5-week calendar, Monday first, ending this week
  const calStart = addDays(mondayOf(today), -28);
  let cal = '<div class="cal">' + ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<div class="h">${x}</div>`).join('');
  for (let i = 0; i < 35; i++) {
    const d = addDays(calStart, i);

    const t = dayInfo(d).total;
    const cls = t > 0.375 + EPS ? 'over' : t >= 0.25 - EPS ? 'high' : t > EPS ? 'bridge' : '';
    cal += `<div class="c ${cls} ${d === today ? 'today' : ''}">${parse(d).getDate()}</div>`;
  }

        ${pillHtml(info.total, info.entries.length > 0, d)}</div>`;
    }
    if (rows) list += `<div class="wk-head"><b>Week of ${short(w)}</b><span>${num(total)} mg</span></div><div class="card" style="margin-top:0;padding:4px 16px">${rows}</div>`;

}

// ---------- weekly chart ----------
const mondayOf = d => addDays(d, -((parse(d).getDay() + 6) % 7));
function weeklyData(today, maxWeeks = 12) {
  const f = firstLogged();
  if (!f) return [];
  const weeks = [];
  for (let w = mondayOf(f); w <= today; w = addDays(w, 7)) {
    let bridge = 0, high = 0, dosed = 0, logged = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(w, i);
      if (d > today || d < f) continue;
      logged++;
      const info = dayInfo(d);
      if (info.total > EPS) dosed++;
      if (info.type === 'bridge') bridge += info.total; else if (isHigh(info.type)) high += info.total;
    }
    weeks.push({ start: w, bridge, high, total: bridge + high, dosed, logged, partial: addDays(w, 6) > today || w < f });
  }
  return weeks.slice(-maxWeeks);
}
const short = d => parse(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const num = n => String(+n.toFixed(3));
function weeklyChartHtml(weeks) {
  if (!weeks.length) return '<p class="plan-text">Log a few days to see the chart.</p>';
  const W = 340, H = 190, L = 30, Rt = 6, T = 16, B = 22, ph = H - T - B, pw = W - L - Rt;
  const max = Math.max(...weeks.map(w => w.total), 0.25);
  const step = max <= 1 ? 0.25 : max <= 2 ? 0.5 : 1;
  const top = Math.ceil(max / step) * step;
  const y = v => T + ph - (v / top) * ph;
  const slot = pw / weeks.length, bw = Math.min(24, slot * 0.6);
  const path = (x, yTop, h, round) => {
    if (h <= 0) return '';
    const r = round ? Math.min(4, h, bw / 2) : 0, b = yTop + h;
    return `M${x},${b}V${yTop + r}${r ? `Q${x},${yTop} ${x + r},${yTop}` : ''}H${x + bw - r}${r ? `Q${x + bw},${yTop} ${x + bw},${yTop + r}` : ''}V${b}Z`;
  };
  let g = '';
  for (let v = 0; v <= top + EPS; v += step)
    g += `<line x1="${L}" x2="${W - Rt}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${num(v)}</text>`;
  const maxIdx = weeks.reduce((m, w, i) => w.total > weeks[m].total ? i : m, 0);
  weeks.forEach((w, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    const hb = (w.bridge / top) * ph, hh = (w.high / top) * ph;
    const gap = hb > 0 && hh > 0 ? 2 : 0;
    g += `<rect class="bg" data-bg="${i}" x="${L + slot * i + 2}" y="${T}" width="${slot - 4}" height="${ph}" rx="4"/>`;
    g += `<path d="${path(x, y(w.bridge), hb, hh === 0)}" fill="var(--c-bridge)"/>`;
    g += `<path d="${path(x, y(w.bridge) - gap - hh, hh, true)}" fill="var(--c-high)"/>`;
    if ((i === weeks.length - 1 || i === maxIdx) && w.total > 0)
      g += `<text class="val" x="${x + bw / 2}" y="${y(w.total) - (gap ? 2 : 0) - 4}" text-anchor="middle">${num(w.total)}</text>`;
    if (weeks.length <= 6 || i % Math.ceil(weeks.length / 6) === 0 || i === weeks.length - 1)
      g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${short(w.start)}</text>`;
    g += `<rect class="hit" data-wk="${i}" x="${L + slot * i}" y="${T}" width="${slot}" height="${ph}" rx="4"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Milligrams per week, last ${weeks.length} weeks">${g}</svg></div>`;
}
function weekReadout(w) {
  return `<b>Week of ${short(w.start)}${w.partial ? ' (partial)' : ''}:</b> ${num(w.total)} mg total · ${num(w.bridge)} bridge · ${num(w.high)} high · ${w.dosed} of ${w.logged} days dosed`;
}

// ---------- backup / restore / export ----------
async function shareOrDownload(name, text, type) {
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return true;
    }
  } catch (e) {
    if (e.name === 'AbortError') return false;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}
async function backup() {
  const name = `dose-log-backup-${logicalToday()}.json`;
  const ok = await shareOrDownload(name, JSON.stringify({ app: 'doselog', version: 1, exportedAt: new Date().toISOString(), data: S }, null, 2), 'application/json');
  if (ok) { S.settings.lastBackup = new Date().toISOString(); save(); render(); }
}
// Plain-text log for pasting into a chat or note.
function logText() {
  const st = S.settings, today = logicalToday();
  const lines = [`DOSE LOG (${st.medName}), exported ${today}`,
    `Plan start: ${st.startDate}. Current interval: ${intervalName(intervalOn(today))}.`,
    `Interval history: ${[...st.intervals].sort((a, b) => a.from.localeCompare(b.from)).map(i => `${i.from} ${intervalName(i.every)}`).join('; ')}`,
    '', 'date | total mg | entries (dose, reason, note, time logged)'];
  const start = S.entries.length && S.entries[0].date < st.startDate ? S.entries[0].date : st.startDate;
  for (let d = start; d <= today; d = addDays(d, 1)) {
    const i = dayInfo(d);
    const es = i.entries.filter(e => e.dose > 0 || e.note).map(e => e.dose === 0 ? `note: "${e.note}"` :
      `${e.dose} ${REASONS[e.reason] || e.reason}${e.note ? ' "' + e.note + '"' : ''}${e.reason === 'backfill' ? '' : ' @' + new Date(e.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
    const none = !i.entries.length && (!firstLogged() || d < firstLogged());
    lines.push(`${d} | ${none ? '-' : +i.total.toFixed(4)} | ${es.join('; ') || (i.entries.length ? 'off (confirmed)' : none ? 'not logged' : 'off')}${S.checkins[d] ? ' | felt: ' + FEELINGS[S.checkins[d]] : ''}`);
  }
  const ws = warningSigns(today);
  lines.push('', 'WARNING SIGNS (per plan)',
    `Tremor doses, last 30 days: ${ws.tremor30} (flag at 2)`,
    `Very high days, all time: ${ws.vhigh} (flag above 1)`,
    `3+ high days in 7 days, not one run: ${ws.cluster ? 'yes, latest ' + ws.cluster : 'no'}`,
    `High days per 28-day block, oldest to now: ${ws.blocks.join(', ')}${ws.rising ? ' (rising, flagged)' : ''}`,
    `Sleep exceptions, last 30 days: ${sleepDaysIn(today, 30)} (max 2)`);
  lines.push('', 'WEEKLY TOTALS (Mon to Sun, mg)');
  weeklyData(today, 520).forEach(w => lines.push(`Week of ${w.start}${w.partial ? ' (partial)' : ''}: ${num(w.total)} total (bridge ${num(w.bridge)}, high ${num(w.high)}), ${w.dosed}/${w.logged} days dosed`));
  return lines.join('\n');
}
async function copyLog() {
  const t = logText();
  try { await navigator.clipboard.writeText(t); alert('Copied. Paste it into your chat or note.'); }
  catch (e) { shareOrDownload(`dose-log-${logicalToday()}.txt`, t, 'text/plain'); }
}
function exportCsv() {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const rows = [['date', 'logged_at', 'dose_mg', 'reason', 'note'].join(',')]
    .concat(S.entries.map(e => [e.date, e.at, e.dose, q(REASONS[e.reason] || e.reason), q(e.note || '')].join(',')));
  shareOrDownload(`dose-log-${logicalToday()}.csv`, rows.join('\n'), 'text/csv');
}
function restore(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      const data = j.data || j;
      if (!Array.isArray(data.entries) || !data.settings) throw new Error('Not a Dose Log backup file.');
      if (!confirm(`Replace what's on this phone with the backup from ${j.exportedAt ? fmt(j.exportedAt.slice(0, 10)) : 'file'} (${data.entries.length} entries)?`)) return;
      S = migrate(data); save(); tab = 'today'; render(); alert('Restored.');
    } catch (e) { alert('Could not restore: ' + e.message); }
  };
  r.readAsText(f);
}

// ---------- import link (#import=<base64url JSON [[date, dose, reason, note], ...]>) ----------
function importFromHash() {
  const m = location.hash.match(/^#import=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  let rows;
  try {
    rows = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
    if (!Array.isArray(rows) || !rows.every(r => /^\d{4}-\d{2}-\d{2}$/.test(r[0]) && r[1] >= 0)) throw new Error('bad data');
  } catch (e) { alert('That import link is not valid.'); return; }
  S = load(); // latest saved data, in case another tab or the installed app changed it
  const dup = r => S.entries.some(e => e.date === r[0] && Math.abs(e.dose - r[1]) < EPS && (e.note || '') === (r[3] || ''));
  const fresh = rows.filter(r => !dup(r));
  if (!fresh.length) { alert('Those entries are already in your log.'); return; }
  const list = fresh.map(r => `${r[0]}: ${r[1] > 0 ? r[1] + ' mg' : 'off'}`).join('\n');
  if (!confirm(`Add ${fresh.length} entries to your log?\n\n${list}`)) return;
  const now = new Date().toISOString();
  fresh.forEach((r, i) => S.entries.push({ id: Date.now().toString(36) + i, at: now, date: r[0], dose: +r[1], reason: r[2] || 'other', note: r[3] || '' }));
  S.entries.sort((a, b) => (a.date + a.at).localeCompare(b.date + b.at));
  save(); alert(`Added ${fresh.length} entries.`);
}

// ---------- boot ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; form = { dose: null, reason: 'scheduled' }; render(); });
// Reload saved data whenever the app comes back to the front or another tab saves,
// so a stale copy in memory never overwrites newer entries.
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S = load(); render(); } });
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
importFromHash();
window.addEventListener('hashchange', () => { importFromHash(); render(); });
render();
</script>
