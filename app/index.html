<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dose Log</title>
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --text: #1b1f1c; --muted: #66706a; --line: #e2e6e3;
    --accent: #166534; --accent-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7;
    --bad: #b91c1c; --bad-soft: #fee2e2; --sos: #7c3aed; --sos-soft: #ede9fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1311; --card: #181d1a; --text: #e8ece9; --muted: #98a39c; --line: #2a312d;
      --accent: #4ade80; --accent-soft: #143322; --warn: #fbbf24; --warn-soft: #3a2c0b;
      --bad: #f87171; --bad-soft: #3b1414; --sos: #a78bfa; --sos-soft: #261c42;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px 6px; display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { font-size: 20px; margin: 0; }
  header small { color: var(--muted); }
  main { padding: 0 16px 96px; max-width: 560px; margin: 0 auto; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; padding: 14px 4px; border: 0; background: none; color: var(--muted);
    font-size: 14px; font-weight: 600; }
  nav button.on { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 12px 0; }
  .plan-dose { font-size: 40px; font-weight: 800; margin: 2px 0; }
  .plan-text { color: var(--muted); }
  .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .dose-btn { flex: 1 1 30%; min-height: 64px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--card); color: var(--text); font-size: 20px; font-weight: 700; }
  .dose-btn.sel { border-color: var(--accent); background: var(--accent-soft); }
  select, input, textarea { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  label.f { display: block; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .primary { width: 100%; margin-top: 16px; min-height: 54px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 18px; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .primary { color: #052e16; } }
  .secondary { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-weight: 600; }
  .note { padding: 10px 12px; border-radius: 10px; margin-top: 10px; font-size: 15px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.bad { background: var(--bad-soft); color: var(--bad); }
  .note.ok { background: var(--accent-soft); color: var(--accent); }
  .note.info { background: var(--bg); color: var(--muted); }
  .hist-day { display: flex; justify-content: space-between; align-items: center; padding: 10px 0;
    border-bottom: 1px solid var(--line); gap: 8px; }
  .hist-day:last-child { border-bottom: 0; }
  .pill { display: inline-block; min-width: 64px; text-align: center; padding: 4px 8px; border-radius: 999px;
    font-weight: 700; font-size: 14px; }
  .p-off { background: var(--bg); color: var(--muted); }
  .p-bridge { background: var(--accent-soft); color: var(--accent); }
  .p-high { background: var(--sos-soft); color: var(--sos); }
  .p-over { background: var(--bad-soft); color: var(--bad); }
  .entry { font-size: 13px; color: var(--muted); }
  .entry button { border: 0; background: none; color: var(--bad); font-size: 13px; padding: 2px 4px; }
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
  .strip div { aspect-ratio: 1; border-radius: 6px; font-size: 11px; display: flex; align-items: center;
    justify-content: center; }
  .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .stat:last-child { border-bottom: 0; }
  .stat b { white-space: nowrap; padding-left: 8px; }
  .stat b.flag { color: var(--bad); }
  details summary { cursor: pointer; font-weight: 600; }
  .rules p, .rules li { font-size: 15px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1 id="title">Dose Log</h1>
  <small id="todayLabel"></small>
</header>
<main id="app"></main>
<nav>
  <button data-tab="today" class="on">Today</button>
  <button data-tab="history">History</button>
  <button data-tab="trends">Trends</button>
  <button data-tab="settings">Settings</button>
</nav>

<script>
'use strict';
// ---------- storage ----------
const KEY = 'doselog.v1';
const EPS = 1e-6;
const REASONS = {
  backfill: 'Backfilled (reason not recorded)',
  scheduled: 'Scheduled bridge (0.125)',
  sos: 'Acute stress (SOS)',
  sleep: 'Sleep exception (acute stress keeping me up)',
  tremor: 'Tremor / tingling / twitching, no trigger',
  late: 'Missed dose, taken late',
  other: 'Other',
};
const INTERVAL_STEPS = [2, 3, 4, 7, 0]; // 0 = none
const intervalName = n => n === 0 ? 'none (medication-free)' : n === 2 ? 'every other day' : n === 7 ? 'weekly' : `every ${n}${n === 3 ? 'rd' : 'th'} day`;

const BRIDGE_START = '2026-09-30';
function migrate(s) {
  const st = s.settings;
  if ((st.rulesVersion || 1) < 2) {
    // Spec v2: bridge start is fixed at Sep 30, 2026; other plan dates derive from it.
    if (st.startDate) {
      st.startDate = BRIDGE_START;
      st.intervals = (st.intervals || []).sort((a, b) => a.from.localeCompare(b.from));
      if (st.intervals.length) st.intervals[0].from = BRIDGE_START; else st.intervals = [{ from: BRIDGE_START, every: 2 }];
    }
    delete st.widenEarliest; delete st.threeOffFrom;
    st.rulesVersion = 2;
  }
  return s;
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.entries)) return migrate(s);
  } catch (e) {}
  return { entries: [], settings: { medName: 'My medicine', startDate: null, intervals: [], lastBackup: null, rulesVersion: 2 } };
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { alert('Could not save on this device: ' + e.message); }
}

// ---------- dates (local, YYYY-MM-DD) ----------
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000); // b - a
const fmt = s => parse(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
// Spec 1: a dose before 6 AM belongs to the previous day.
const DAY_CUTOFF_HOUR = 6;
function logicalToday() { const d = new Date(); if (d.getHours() < DAY_CUTOFF_HOUR) d.setDate(d.getDate() - 1); return ymd(d); }
const mg = n => `${+n.toFixed(4)} mg`;
const unlockSkip3 = () => addDays(S.settings.startDate, 21);
const widenEarliest = () => addDays(S.settings.startDate, 14);

// ---------- derived data ----------
function dayInfo(date) {
  const es = S.entries.filter(e => e.date === date);
  const total = es.reduce((a, e) => a + e.dose, 0);
  return { entries: es, total, sleep: es.some(e => e.reason === 'sleep'),
    tremor: es.some(e => e.reason === 'tremor'), type: dayType(total) };
}
// Spec 1: off 0, bridge 0.125, high 0.25 to 0.375, very high above 0.375 (0.5 or more).
function dayType(t) { return t > 0.375 + EPS ? 'vhigh' : t >= 0.25 - EPS ? 'high' : t > EPS ? 'bridge' : 'off'; }
const isHigh = type => type === 'high' || type === 'vhigh';
function intervalOn(date) {
  let every = 2;
  for (const iv of [...S.settings.intervals].sort((a, b) => a.from.localeCompare(b.from)))
    if (iv.from <= date) every = iv.every;
  return every;
}
function lastDosedBefore(date, maxBack = 120) {
  for (let k = 1; k <= maxBack; k++) {
    const d = addDays(date, -k);
    if (dayInfo(d).total > EPS) return d;
  }
  return null;
}
function highRunEnding(date) {
  let len = 0, vhigh = false, d = date;
  while (isHigh(dayInfo(d).type)) { len++; vhigh = vhigh || dayInfo(d).type === 'vhigh'; d = addDays(d, -1); }
  return { len, vhigh };
}
function tremorDaysIn(endDate, days) {
  return new Set(S.entries.filter(e => e.reason === 'tremor' && e.dose > 0 && e.date <= endDate && diffDays(e.date, endDate) < days).map(e => e.date)).size;
}

// What the plan says for `date`, based only on days before it.
function planFor(date) {
  const st = S.settings;
  if (!st.startDate) return null;
  if (date < st.startDate) return { kind: 'before', head: '—', text: `Plan starts ${fmt(st.startDate)}.` };
  const every = intervalOn(date);
  const L = lastDosedBefore(date);
  if (!L) return { kind: 'due', head: '0.125', text: 'No doses logged yet. The normal pattern starts with 0.125.' };
  const gap = diffDays(L, date);
  const last = dayInfo(L);
  const notes = [];

  if (isHigh(last.type)) {
    const run = highRunEnding(L);
    if (gap === 1) {
      if (run.len >= 3) notes.push({ cls: 'bad', t: 'No 4th high day in a row. If the emergency is still going on, get medical advice.' });
      else notes.push({ cls: 'info', t: `Only if the same acute stress continues: 0.25 again (would be day ${run.len + 1} of max 3). Otherwise off.` });
    }
    // Spec 2: at interval "none", nothing follows a high day.
    if (every === 0) return { kind: 'off', head: 'Off', text: `Interval is none. No 0.125 follows the ${mg(last.total)} day on ${fmt(L)}.`, notes };
    const off = Math.max(run.vhigh ? 3 : 2, every - 1);
    if (run.vhigh && gap <= off) notes.push({ cls: 'info', t: `After a very high day: ${off} off days, then 0.125.` });
    if (run.len >= 3 && off === 2 && gap <= off + 1) {
      if (date >= unlockSkip3() && tremorDaysIn(addDays(date, -1), 14) === 0)
        notes.push({ cls: 'info', t: `Option unlocked: after a 3-day run you may skip 3 days instead of 2 (0.125 on ${fmt(addDays(L, 4))}).` });
    }
    if (gap <= off) return { kind: 'off', head: 'Off', text: `Off day ${gap} of ${off} after ${mg(last.total)} on ${fmt(L)}. Next 0.125: ${fmt(addDays(L, off + 1))}.`, notes };
    return dueOrLate(addDays(L, off + 1), date, `Bridge 0.125 after the ${mg(last.total)} day.`, notes);
  }

  // last dose was a 0.125 bridge (scheduled, late or tremor: all restart the count)
  if (every === 0) return { kind: 'off', head: 'Off', text: 'Interval is none. No scheduled doses.', notes };
  const due = addDays(L, every);
  if (date < due) return { kind: 'off', head: 'Off', text: `Off day ${gap} of ${every - 1}. Next 0.125: ${fmt(due)} (${intervalName(every)}).`, notes };
  return dueOrLate(due, date, `Scheduled 0.125 (${intervalName(every)}).`, notes);
}
function dueOrLate(due, date, text, notes) {
  if (date === due) return { kind: 'due', head: '0.125', text, notes };
  notes.push({ cls: 'warn', t: `Was due ${fmt(due)}. Take it once, today. The count restarts from today. Never double up.` });
  return { kind: 'due', head: '0.125', text: text + ' (late)', notes };
}

function sleepDaysIn(endDate, days, extraDate) {
  const n = new Set(S.entries.filter(e => e.reason === 'sleep' && e.date <= endDate && diffDays(e.date, endDate) < days).map(e => e.date));
  if (extraDate) n.add(extraDate);
  return n.size;
}

// Hard-limit checks (spec 5) for a date if `extra` dose with `reason` were added. Warns, never blocks.
function checks(date, extra = 0, reason = null) {
  const cur = dayInfo(date);
  const total = cur.total + extra;
  const sleep = cur.sleep || reason === 'sleep';
  const type = dayType(total);
  const w = [];
  if (type === 'vhigh') {
    w.push(`${mg(total)} is a very high day. Not part of the plan: ${Math.max(3, intervalOn(date) - 1)} off days follow, then 0.125.`);
    const n = allDays().filter(d => d !== date && dayInfo(d).type === 'vhigh').length;
    if (n >= 1) w.push('WARNING SIGN: more than one very high day. Reassess the plan.');
  } else if (total > 0.25 + EPS && !sleep) {
    w.push('Above 0.25 in a day is only for the sleep exception (extra 0.25 at night, max 0.375).' +
      (Math.abs(cur.total - 0.125) < EPS ? ' Hard day on a 0.125 day: add only 0.125 (total 0.25).' : ''));
  }
  const prev = dayInfo(addDays(date, -1));
  if (type === 'bridge' && prev.type === 'bridge') w.push('Never 0.125 two days in a row.');
  if (isHigh(type)) {
    let len = 1, d = addDays(date, -1);
    while (isHigh(dayInfo(d).type)) { len++; d = addDays(d, -1); }
    if (len >= 4) w.push('4th high day in a row. If the emergency is still going on, get medical advice.');
    if (extra > 0 && reason !== 'sos' && reason !== 'sleep' && !cur.entries.some(e => e.reason === 'sos' || e.reason === 'sleep'))
      w.push('0.25 is only for genuinely acute stress. Pick "Acute stress (SOS)" as the reason if that is what this is.');
  }
  if (sleep) {
    if (prev.sleep) w.push('Sleep exception: not two nights in a row.');
    const n = sleepDaysIn(date, 30, date);
    if (n > 2) w.push(`Sleep exception used ${n} times in the last 30 days. Max is twice.`);
  }
  if (reason === 'tremor' && extra > 0 && prev.total > EPS)
    w.push('Tremor dose: not allowed when there was any dose yesterday.');
  if (type === 'bridge' && extra > 0 && cur.total < EPS) {
    const p = planFor(date);
    if (p && p.kind === 'off' && reason !== 'tremor' && reason !== 'sos')
      w.push('The plan says today is an off day.');
  }
  return w;
}

// Warning signs (spec 6).
function warningSigns(today) {
  const days = allDays();
  const tremor30 = tremorDaysIn(today, 30);
  const vhigh = days.filter(d => dayInfo(d).type === 'vhigh').length;
  // 3+ high days within any 7 days that aren't one consecutive run. Report the latest window.
  let cluster = null;
  const highs = days.filter(d => isHigh(dayInfo(d).type));
  for (let i = 0; i < highs.length; i++) {
    const win = highs.filter(d => d <= highs[i] && diffDays(d, highs[i]) < 7);
    if (win.length >= 3 && diffDays(win[0], win[win.length - 1]) !== win.length - 1) cluster = highs[i];
  }
  // High-day count per 28-day block ending today: rising two blocks in a row.
  const block = k => days.filter(d => { const g = diffDays(d, today); return g >= 28 * k && g < 28 * (k + 1) && isHigh(dayInfo(d).type); }).length;
  const blocks = [block(2), block(1), block(0)];
  return { tremor30, vhigh, cluster, blocks, rising: blocks[0] < blocks[1] && blocks[1] < blocks[2] };
}
function allDays() { return [...new Set(S.entries.map(e => e.date))].sort(); }

// ---------- UI ----------
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let tab = 'today';
let form = { dose: null, reason: 'scheduled' };

function render() {
  $('#title').textContent = S.settings.medName || 'Dose Log';
  $('#todayLabel').textContent = fmt(logicalToday());
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (!S.settings.startDate) return renderSetup();
  ({ today: renderToday, history: renderHistory, trends: renderTrends, settings: renderSettings })[tab]();
}

function renderSetup() {
  $('#app').innerHTML = `
  <div class="card">
    <h2 style="margin-top:0">Set up</h2>
    <p class="plan-text">Bridge start date (from your plan). You can change it later in Settings.
    If you already took doses in the last few days, log them after setup (you can pick any date when logging) so the app knows where you are in the pattern.</p>
    <label class="f">Name shown at the top (kept only on this phone)
      <input id="su-name" value="${esc(S.settings.medName)}"></label>
    <label class="f">Bridge start date <input id="su-start" type="date" value="${BRIDGE_START}"></label>
    <button class="primary" id="su-go">Start</button>
  </div>`;
  $('#su-go').onclick = () => {
    const d = $('#su-start').value;
    if (!d) return alert('Pick a start date.');
    S.settings.medName = $('#su-name').value.trim() || 'My medicine';
    S.settings.startDate = d;
    S.settings.intervals = [{ from: d, every: 2 }];
    save(); render();
  };
}

function noteHtml(n) { return `<div class="note ${n.cls}">${esc(n.t)}</div>`; }

function renderToday() {
  const today = logicalToday();
  const p = planFor(today);
  const info = dayInfo(today);
  const backupDue = S.entries.length && (!S.settings.lastBackup || diffDays(S.settings.lastBackup.slice(0, 10), today) >= 7);
  const doneNow = info.total > EPS;
  if (form.date === undefined) form.date = today;

  $('#app').innerHTML = `
  ${backupDue ? `<div class="note warn">No backup in 7+ days. <a href="#" id="bk-now">Back up now</a></div>` : ''}
  <div class="card">
    <div class="label">Plan for today</div>
    <div class="plan-dose">${p.head === 'Off' ? 'Off day' : p.head === '—' ? '—' : p.head + ' mg'}</div>
    <div class="plan-text">${esc(p.text)}</div>
    ${(p.notes || []).map(noteHtml).join('')}
    ${doneNow ? `<div class="note ok">Logged today: ${mg(info.total)}</div>` : ''}
  </div>
  <div class="card">
    <div class="label">Log a dose</div>
    <div class="row" style="margin-top:8px">
      ${[0.125, 0.25].map(d => `<button class="dose-btn ${form.dose === d ? 'sel' : ''}" data-dose="${d}">${d}</button>`).join('')}
      <button class="dose-btn ${form.dose === 'custom' ? 'sel' : ''}" data-dose="custom">Other</button>
    </div>
    <div id="custom-wrap" class="${form.dose === 'custom' ? '' : 'hidden'}">
      <label class="f">Amount (mg) <input id="custom" type="number" inputmode="decimal" step="0.0625" min="0" value="${esc(form.custom || '')}"></label>
    </div>
    <label class="f">Reason
      <select id="reason">${Object.entries(REASONS).filter(([k]) => k !== 'backfill').map(([k, v]) => `<option value="${k}" ${form.reason === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label class="f" style="display:flex;gap:10px;align-items:center;color:var(--text)">
      <input id="noslept" type="checkbox" style="width:22px;height:22px" ${form.noSleep ? 'checked' : ''}> Haven't slept yet (counts for the previous day)</label>
    <label class="f">Date (before 6 AM counts as the previous day)
      <input id="date" type="date" value="${form.date}" max="${ymd(new Date())}"></label>
    <label class="f">Note (optional) <input id="note" value="${esc(form.note || '')}" placeholder="What happened?"></label>
    <div id="live-warn"></div>
    <button class="primary" id="save">Save</button>
  </div>
  ${doneNow ? '' : `<div class="card"><button class="secondary" id="offok" style="width:100%">Mark today as off day (no dose)</button></div>`}
  ${info.entries.length ? `<div class="card"><div class="label">Today's entries</div>${info.entries.map(entryHtml).join('')}</div>` : ''}`;

  document.querySelectorAll('[data-dose]').forEach(b => b.onclick = () => {
    syncForm();
    const v = b.dataset.dose; form.dose = v === 'custom' ? 'custom' : +v;
    if (form.dose === 0.25 && form.reason === 'scheduled') form.reason = 'sos';
    if (form.dose === 0.125 && form.reason === 'sos') form.reason = 'scheduled';
    renderToday();
  });
  $('#noslept').onchange = () => {
    syncForm(); form.noSleep = $('#noslept').checked;
    form.date = form.noSleep ? addDays(ymd(new Date()), -1) : logicalToday();
    renderToday();
  };
  ['reason', 'date', 'note', 'custom'].forEach(id => { const el = $('#' + id); if (el) el.oninput = () => { syncForm(); liveWarn(); }; });
  $('#save').onclick = saveDose;
  if ($('#offok')) $('#offok').onclick = () => { addEntry({ date: today, dose: 0, reason: 'off', note: '' }); };
  if ($('#bk-now')) $('#bk-now').onclick = e => { e.preventDefault(); backup(); };
  bindDeletes();
  liveWarn();
}
function syncForm() {
  form.reason = $('#reason').value; form.date = $('#date').value; form.note = $('#note').value;
  if ($('#custom')) form.custom = $('#custom').value;
}
function formDose() { return form.dose === 'custom' ? parseFloat(form.custom) : form.dose; }
function liveWarn() {
  const d = formDose();
  const el = $('#live-warn');
  if (!el) return;
  if (!(d > 0) || !form.date) { el.innerHTML = ''; return; }
  el.innerHTML = checks(form.date, d, form.reason).map(t => noteHtml({ cls: 'bad', t })).join('');
}
function saveDose() {
  syncForm();
  const d = formDose();
  if (!(d > 0)) return alert('Pick a dose first.');
  if (!form.date) return alert('Pick a date.');
  if (form.date > ymd(new Date())) return alert('That date is in the future.');
  const w = checks(form.date, d, form.reason);
  if (w.length && !confirm('Heads up:\n\n• ' + w.join('\n• ') + '\n\nSave anyway?')) return;
  addEntry({ date: form.date, dose: d, reason: form.reason, note: form.note || '' });
  form = { dose: null, reason: 'scheduled' };
}
function addEntry(e) {
  S.entries.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), at: new Date().toISOString(), ...e });
  S.entries.sort((a, b) => (a.date + a.at).localeCompare(b.date + b.at));
  save(); render();
}
function entryHtml(e) {
  const t = new Date(e.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const what = e.dose > 0 ? `${mg(e.dose)} · ${esc(REASONS[e.reason] || e.reason)}${e.note ? ' · ' + esc(e.note) : ''}` : 'Off day confirmed';
  return `<div class="entry">${what} · logged ${t}
    <button data-del="${e.id}">delete</button></div>`;
}
function bindDeletes() {
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('Delete this entry?')) return;
    S.entries = S.entries.filter(e => e.id !== b.dataset.del); save(); render();
  });
}
function firstLogged() { return S.entries.length ? S.entries[0].date : null; }
function pillHtml(total, hasEntries, date) {
  const f = firstLogged();
  if (!hasEntries && (!f || date < f)) return `<span class="pill p-off">not logged</span>`;
  if (!hasEntries || total < EPS) return `<span class="pill p-off">${hasEntries ? 'off ✓' : 'off'}</span>`;
  const cls = total > 0.25 + EPS ? 'p-over' : total >= 0.25 - EPS ? 'p-high' : 'p-bridge';
  return `<span class="pill ${cls}">${+total.toFixed(4)}</span>`;
}

function renderHistory() {
  const today = logicalToday();
  const start = S.entries.length ? S.entries[0].date < S.settings.startDate ? S.entries[0].date : S.settings.startDate : S.settings.startDate;
  const days = [];
  for (let d = today; d >= start && days.length < 400; d = addDays(d, -1)) days.push(d);
  // last 28 days strip, Monday-first weeks
  const first = addDays(today, -27);
  const lead = (parse(first).getDay() + 6) % 7;
  let strip = '<div class="strip">' + ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<div class="label">${x}</div>`).join('');
  for (let i = 0; i < lead; i++) strip += '<div></div>';
  for (let i = 0; i < 28; i++) {
    const d = addDays(first, i), t = dayInfo(d).total;
    const cls = t > 0.25 + EPS ? 'p-over' : t >= 0.25 - EPS ? 'p-high' : t > EPS ? 'p-bridge' : 'p-off';
    strip += `<div class="${cls}" title="${d}">${parse(d).getDate()}</div>`;
  }
  strip += '</div>';
  $('#app').innerHTML = `
    <button class="primary" id="copy-hist" style="margin-top:12px">Copy log</button>
    <div class="card"><div class="label">Last 4 weeks</div>${strip}
      <p class="entry" style="margin-bottom:0"><span class="pill p-bridge">0.125</span> <span class="pill p-high">0.25</span> <span class="pill p-over">&gt;0.25</span></p></div>
    <div class="card">${days.map(d => {
      const i = dayInfo(d);
      return `<div class="hist-day"><div><b>${fmt(d)}</b>${i.entries.map(entryHtml).join('')}</div>${pillHtml(i.total, i.entries.length > 0, d)}</div>`;
    }).join('') || '<p class="plan-text">Nothing logged yet.</p>'}</div>`;
  $('#copy-hist').onclick = copyLog;
  bindDeletes();
}

function renderTrends() {
  const today = logicalToday();
  const st = S.settings;
  const days = allDays();
  const ws = warningSigns(today);
  const sleep30 = sleepDaysIn(today, 30);
  const lastHigh = [...days].reverse().find(d => isHigh(dayInfo(d).type));
  const every = intervalOn(today);
  const ivs = [...st.intervals].sort((a, b) => a.from.localeCompare(b.from));
  const curFrom = ivs.length ? ivs[ivs.length - 1].from : st.startDate;
  const held = diffDays(curFrom, today);
  const next = INTERVAL_STEPS[INTERVAL_STEPS.indexOf(every) + 1];
  const tremor14 = tremorDaysIn(today, 14);
  const widenWarn = [];
  if (today < widenEarliest()) widenWarn.push(`Earliest first widening is ${fmt(widenEarliest())}.`);
  if (held < 14) widenWarn.push(`Only ${held} days at the current step (needs 14).`);
  if (tremor14 > 0) widenWarn.push(`${tremor14} tremor dose${tremor14 > 1 ? 's' : ''} in the last 14 days.`);
  const stat = (k, v, flag) => `<div class="stat"><span>${k}</span><b class="${flag ? 'flag' : ''}">${v}</b></div>`;

  $('#app').innerHTML = `
  <div class="card"><div class="label">Warning signs</div>
    ${stat('Tremor doses, last 30 days (flag at 2)', ws.tremor30, ws.tremor30 >= 2)}
    ${stat('Very high days, all time (flag above 1)', ws.vhigh, ws.vhigh > 1)}
    ${stat('3+ high days in 7 days, not one run', ws.cluster ? 'yes, ' + fmt(ws.cluster) : 'no', !!ws.cluster)}
    ${stat('High days per 28-day block (oldest → now)', ws.blocks.join(' → '), ws.rising)}
    ${stat('Sleep exceptions, last 30 days (max 2)', sleep30, sleep30 > 2)}
    ${stat('Days since last high day', lastHigh ? diffDays(lastHigh, today) : 'none logged')}
    <div class="note info">Red = a warning sign from your plan. Also reassess if 0.25 stops feeling sufficient or you want more.</div>
  </div>
  <div class="card"><div class="label">Widening</div>
    ${stat('Current interval', intervalName(every))}
    ${stat('Held since', `${fmt(curFrom)} (${held} days)`)}
    ${stat('Earliest first widening', fmt(widenEarliest()))}
    ${stat('"Skip 3" option after a 3-day run from', fmt(unlockSkip3()))}
    ${next === undefined ? '' : `
      ${widenWarn.length ? widenWarn.map(t => noteHtml({ cls: 'warn', t })).join('') : noteHtml({ cls: 'ok', t: 'No widening warnings.' })}
      <button class="primary" id="widen">Move to ${intervalName(next)}</button>`}
    ${ivs.length > 1 ? `<button class="secondary" id="undo-widen" style="margin-top:10px">Undo last interval change</button>` : ''}
  </div>`;
  if ($('#widen')) $('#widen').onclick = () => {
    const msg = (widenWarn.length ? 'Heads up:\n\n• ' + widenWarn.join('\n• ') + '\n\n' : '') + `Move to ${intervalName(next)} starting today?`;
    if (!confirm(msg)) return;
    S.settings.intervals = S.settings.intervals.filter(i => i.from !== today);
    S.settings.intervals.push({ from: today, every: next }); save(); render();
  };
  if ($('#undo-widen')) $('#undo-widen').onclick = () => {
    if (!confirm('Go back to the previous interval?')) return;
    S.settings.intervals.sort((a, b) => a.from.localeCompare(b.from)).pop(); save(); render();
  };
}

function renderSettings() {
  const st = S.settings;
  $('#app').innerHTML = `
  <div class="card"><div class="label">Backup</div>
    <p class="plan-text">Your log lives only on this phone. Back up weekly: tap Back up, then pick Google Drive (or email it to yourself).
    Last backup: <b>${st.lastBackup ? fmt(st.lastBackup.slice(0, 10)) : 'never'}</b></p>
    <div class="row">
      <button class="secondary" id="bk">Back up</button>
      <button class="secondary" id="csv">Export CSV</button>
      <button class="secondary" id="copy">Copy log as text</button>
      <button class="secondary" id="restore">Restore</button>
      <input type="file" id="file" accept=".json,application/json" class="hidden">
    </div>
  </div>
  <div class="card"><div class="label">Plan settings</div>
    <label class="f">Name at the top <input id="s-name" value="${esc(st.medName)}"></label>
    <label class="f">Bridge start date <input id="s-start" type="date" value="${st.startDate}"></label>
    <p class="entry">Earliest first widening: ${fmt(widenEarliest())} (start + 14). "Skip 3" option: from ${fmt(unlockSkip3())} (start + 21).</p>
    <label class="f">Current interval
      <select id="s-int">${INTERVAL_STEPS.map(n => `<option value="${n}" ${intervalOn(logicalToday()) === n ? 'selected' : ''}>${intervalName(n)}</option>`).join('')}</select></label>
    <button class="primary" id="s-save">Save settings</button>
  </div>
  <div class="card rules"><details><summary>Plan rules (reference)</summary>
    <ul>
      <li><b>A day:</b> a dose before 6 AM, or marked "haven't slept yet", belongs to the previous day. Day total: 0 off, 0.125 bridge, 0.25 to 0.375 high, 0.5+ very high.</li>
      <li><b>After a bridge day:</b> next 0.125 after the current interval.</li>
      <li><b>After a high day or run:</b> off days = larger of 2 or (interval − 1), then 0.125. After a very high day: larger of 3 or (interval − 1).</li>
      <li><b>After a 3-day high run:</b> default 2 off days. "Skip 3" is an option from start + 21 days with no tremor dose in the last 14 days.</li>
      <li><b>Interval none:</b> no scheduled 0.125; nothing follows a high day.</li>
      <li><b>A new high day during off days</b> restarts the count.</li>
      <li><b>Late 0.125:</b> take it once, the day it's remembered. Count restarts from that day.</li>
      <li><b>Tremor dose:</b> allowed unless there was any dose yesterday. Restarts the count like a normal 0.125.</li>
      <li><b>Intervals:</b> 2 → 3 → 4 → 7 → none, by button only. Earliest first widening start + 14. Warn if under 14 days at the step or any tremor dose in the last 14 days. High days never change the interval.</li>
      <li><b>Hard limits:</b> above 0.25/day (except 0.375 with the extra 0.25 at night for sleep). 0.125 two days in a row. 4th high day in a row. Sleep exception two nights in a row or more than twice in 30 days.</li>
      <li><b>Warning signs:</b> 2+ tremor doses in 30 days. More than one very high day. 3+ high days in 7 days not in one run. High days rising two 28-day blocks in a row.</li>
    </ul></details></div>
  <div class="card"><button class="secondary" id="wipe" style="color:var(--bad)">Erase all data on this phone</button></div>`;

  $('#bk').onclick = backup;
  $('#csv').onclick = exportCsv;
  $('#copy').onclick = copyLog;
  $('#restore').onclick = () => $('#file').click();
  $('#file').onchange = restore;
  $('#s-save').onclick = () => {
    const start = $('#s-start').value;
    if (!start) return alert('Bridge start date is required.');
    st.medName = $('#s-name').value.trim() || 'My medicine';
    if (start !== st.startDate) {
      st.intervals = st.intervals.filter(i => i.from > start);
      st.intervals.unshift({ from: start, every: 2 });
      st.startDate = start;
    }
    const every = +$('#s-int').value, today = logicalToday();
    if (every !== intervalOn(today)) {
      const from = today < start ? start : today;
      st.intervals = st.intervals.filter(i => i.from !== from);
      st.intervals.push({ from, every });
    }
    save(); alert('Saved.'); render();
  };
  $('#wipe').onclick = () => {
    if (!confirm('Erase every entry and setting on this phone? Make a backup first.')) return;
    if (!confirm('Really erase? This cannot be undone.')) return;
    localStorage.removeItem(KEY); S = load(); tab = 'today'; render();
  };
}

// ---------- backup / restore / export ----------
async function shareOrDownload(name, text, type) {
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return true;
    }
  } catch (e) {
    if (e.name === 'AbortError') return false;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}
async function backup() {
  const name = `dose-log-backup-${logicalToday()}.json`;
  const ok = await shareOrDownload(name, JSON.stringify({ app: 'doselog', version: 1, exportedAt: new Date().toISOString(), data: S }, null, 2), 'application/json');
  if (ok) { S.settings.lastBackup = new Date().toISOString(); save(); render(); }
}
// Plain-text log for pasting into a chat or note.
function logText() {
  const st = S.settings, today = logicalToday();
  const lines = [`DOSE LOG (${st.medName}), exported ${today}`,
    `Plan start: ${st.startDate}. Current interval: ${intervalName(intervalOn(today))}.`,
    `Interval history: ${[...st.intervals].sort((a, b) => a.from.localeCompare(b.from)).map(i => `${i.from} ${intervalName(i.every)}`).join('; ')}`,
    '', 'date | total mg | entries (dose, reason, note, time logged)'];
  const start = S.entries.length && S.entries[0].date < st.startDate ? S.entries[0].date : st.startDate;
  for (let d = start; d <= today; d = addDays(d, 1)) {
    const i = dayInfo(d);
    const es = i.entries.filter(e => e.dose > 0).map(e =>
      `${e.dose} ${REASONS[e.reason] || e.reason}${e.note ? ' "' + e.note + '"' : ''}${e.reason === 'backfill' ? '' : ' @' + new Date(e.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
    const none = !i.entries.length && (!firstLogged() || d < firstLogged());
    lines.push(`${d} | ${none ? '-' : +i.total.toFixed(4)} | ${es.join('; ') || (i.entries.length ? 'off (confirmed)' : none ? 'not logged' : 'off')}`);
  }
  const ws = warningSigns(today);
  lines.push('', 'WARNING SIGNS (per plan)',
    `Tremor doses, last 30 days: ${ws.tremor30} (flag at 2)`,
    `Very high days, all time: ${ws.vhigh} (flag above 1)`,
    `3+ high days in 7 days, not one run: ${ws.cluster ? 'yes, latest ' + ws.cluster : 'no'}`,
    `High days per 28-day block, oldest to now: ${ws.blocks.join(', ')}${ws.rising ? ' (rising, flagged)' : ''}`,
    `Sleep exceptions, last 30 days: ${sleepDaysIn(today, 30)} (max 2)`);
  return lines.join('\n');
}
async function copyLog() {
  const t = logText();
  try { await navigator.clipboard.writeText(t); alert('Copied. Paste it into your chat or note.'); }
  catch (e) { shareOrDownload(`dose-log-${logicalToday()}.txt`, t, 'text/plain'); }
}
function exportCsv() {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const rows = [['date', 'logged_at', 'dose_mg', 'reason', 'note'].join(',')]
    .concat(S.entries.map(e => [e.date, e.at, e.dose, q(REASONS[e.reason] || e.reason), q(e.note || '')].join(',')));
  shareOrDownload(`dose-log-${logicalToday()}.csv`, rows.join('\n'), 'text/csv');
}
function restore(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      const data = j.data || j;
      if (!Array.isArray(data.entries) || !data.settings) throw new Error('Not a Dose Log backup file.');
      if (!confirm(`Replace what's on this phone with the backup from ${j.exportedAt ? fmt(j.exportedAt.slice(0, 10)) : 'file'} (${data.entries.length} entries)?`)) return;
      S = migrate(data); save(); tab = 'today'; render(); alert('Restored.');
    } catch (e) { alert('Could not restore: ' + e.message); }
  };
  r.readAsText(f);
}

// ---------- import link (#import=<base64url JSON [[date, dose, reason, note], ...]>) ----------
function importFromHash() {
  const m = location.hash.match(/^#import=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  let rows;
  try {
    rows = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
    if (!Array.isArray(rows) || !rows.every(r => /^\d{4}-\d{2}-\d{2}$/.test(r[0]) && r[1] >= 0)) throw new Error('bad data');
  } catch (e) { alert('That import link is not valid.'); return; }
  S = load(); // latest saved data, in case another tab or the installed app changed it
  const dup = r => S.entries.some(e => e.date === r[0] && Math.abs(e.dose - r[1]) < EPS && (e.note || '') === (r[3] || ''));
  const fresh = rows.filter(r => !dup(r));
  if (!fresh.length) { alert('Those entries are already in your log.'); return; }
  const list = fresh.map(r => `${r[0]}: ${r[1] > 0 ? r[1] + ' mg' : 'off'}`).join('\n');
  if (!confirm(`Add ${fresh.length} entries to your log?\n\n${list}`)) return;
  const now = new Date().toISOString();
  fresh.forEach((r, i) => S.entries.push({ id: Date.now().toString(36) + i, at: now, date: r[0], dose: +r[1], reason: r[2] || 'other', note: r[3] || '' }));
  S.entries.sort((a, b) => (a.date + a.at).localeCompare(b.date + b.at));
  save(); alert(`Added ${fresh.length} entries.`);
}

// ---------- boot ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; form = { dose: null, reason: 'scheduled' }; render(); });
// Reload saved data whenever the app comes back to the front or another tab saves,
// so a stale copy in memory never overwrites newer entries.
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S = load(); render(); } });
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
importFromHash();
window.addEventListener('hashchange', () => { importFromHash(); render(); });
render();
</script>
</body>
</html>
